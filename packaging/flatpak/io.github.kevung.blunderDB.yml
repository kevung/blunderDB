# Flatpak manifest for blunderDB. See packaging/flatpak/README.md.
#
# This packages the prebuilt webkit2gtk-4.1 release tarball (the same artifact
# the GitHub release publishes). It is the simplest route and is enough to build
# a local .flatpak / self-hosted repo. Flathub itself requires a from-source,
# fully offline build (Go + Node vendoring) instead — see docs/recherche/
# P16-distribution-desktop.md; that submission is tracked separately
# (tasks/BACKLOG.md) and is not what this file does.
#
# The url/sha256 below are kept current, not a dead placeholder:
# `scripts/release.sh` rewrites them on every release cut to point at the
# latest already-published tarball (the tag being cut has no assets yet), so
# the file committed here always builds as-is. CI never reads this checked-in
# url/sha256: the `flatpak` job of .github/workflows/build.yml renders its own
# copy with a local `path:` source pointing at the tarball the matrix just
# built for the tag being released, and that copy — not this file — is what
# the published bundle is built from.
#
# Build & install locally:
#   flatpak install -y flathub org.gnome.Platform//47 org.gnome.Sdk//47
#   flatpak-builder --user --install --force-clean build-dir \
#     packaging/flatpak/io.github.kevung.blunderDB.yml
#   flatpak run io.github.kevung.blunderDB
#
# IMPORTANT — test before trusting the sandbox: open and SAVE a .db file located
# outside the sandbox. If Wails' GTK file dialog does not route through the XDG
# portal, the --filesystem grant below is what makes arbitrary .db paths work.

app-id: io.github.kevung.blunderDB
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: blunderDB

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # blunderDB opens/saves user-chosen .db files anywhere. Prefer portals, but
  # Wails' native GTK dialogs may not route through them; --filesystem=home
  # keeps arbitrary paths working. Narrow this if portal access proves enough.
  - --filesystem=home

modules:
  - name: blunderdb
    buildsystem: simple
    build-commands:
      - install -Dm755 blunderDB /app/bin/blunderDB
      # Lowercase name, as the CLI documentation and the other packages use.
      - ln -s blunderDB /app/bin/blunderdb
      # Flathub requires desktop/icon/metainfo to be named after the app-id.
      - install -Dm644 blunderdb-256.png /app/share/icons/hicolor/256x256/apps/io.github.kevung.blunderDB.png
      - |
        sed -e 's/^Icon=blunderdb/Icon=io.github.kevung.blunderDB/' \
            blunderdb.desktop > io.github.kevung.blunderDB.desktop
        install -Dm644 io.github.kevung.blunderDB.desktop \
            /app/share/applications/io.github.kevung.blunderDB.desktop
      - |
        sed -e 's#<launchable type="desktop-id">blunderdb.desktop#<launchable type="desktop-id">io.github.kevung.blunderDB.desktop#' \
            io.github.kevung.blunderDB.metainfo.xml > metainfo.fixed.xml
        install -Dm644 metainfo.fixed.xml \
            /app/share/metainfo/io.github.kevung.blunderDB.metainfo.xml
      # Licence and third-party notices (Strehl network, GNUbg bearoff tables,
      # Go/JS libraries, fonts). THIRD_PARTY.md is guarded so a tarball built
      # before CI staged the file still packages.
      - install -Dm644 LICENSE /app/share/doc/blunderdb/LICENSE
      - |
        if [ -f THIRD_PARTY.md ]; then
          install -Dm644 THIRD_PARTY.md /app/share/doc/blunderdb/THIRD_PARTY.md
        fi
    sources:
      - type: archive
        # Rewritten by `scripts/release.sh` on every release cut (see the file
        # header). The tarball unpacks to blunderDB-linux-webkit2gtk-4.1-<ver>/,
        # flattened by strip-components.
        url: https://github.com/kevung/blunderDB/releases/download/0.35.0/blunderDB-linux-webkit2gtk-4.1-0.35.0.tar.gz
        sha256: 90bc93ac5c28ac0a0f5b37dee7bbf537066a599249e35d68478b8ba2bd7522cd
        strip-components: 1

# Grouped dependency bumps, one PR per ecosystem per run instead of one per
# module. Minor and patch updates are grouped together; a major bump keeps its
# own PR because it usually needs a human to read the changelog (Svelte,
# Wails, golangci-lint...). gomod and github-actions run weekly; npm (D.15,
# #216) runs monthly — the frontend's build-chain majors are handled by hand
# anyway (see the `ignore` rule below), so a weekly cadence there was mostly
# minor/patch noise.
#
# github-actions bumps rewrite the SHA-pinned `uses:` lines in the workflows
# and keep the `# vX.Y.Z` comment in step — that is how the pins stay current.
#
# `docker` (E.11, #227): the three ecosystems above only ever covered version
# updates of tracked dependency manifests — the two base images in
# Dockerfile.serve/Dockerfile.hostile (golang:1.25-alpine,
# golang:1.25-bookworm, gcr.io/distroless/static-debian12) had no Dependabot
# coverage at all, version-pinned tags that would otherwise drift silently.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wails is bumped by hand, with the application run on each OS (#409):
    # 2.15 needs go-webview2 v1.0.22 against our v1.0.16 `replace`, and a
    # grouped bump only turns every x/ update red on windows-latest (#419).
    ignore:
      - dependency-name: "github.com/wailsapp/wails/v2"
        versions: [">= 2.11.0"]
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # A major bump of one build-chain package alone (vite 8 while
    # vite-plugin-svelte still wants 7, jest-dom 7, prettier-plugin-svelte 4)
    # cannot resolve: npm ci fails with ERESOLVE on every job. Those upgrades
    # are done by hand, together, with their peers.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # The toolchain stays on Go 1.26 until #409: under 1.27 the Wails CLI
    # v2.10.2 no longer loads the standard library and golangci-lint v2.11.4
    # crashes (#412). Lift this rule in the branch that moves to 1.27.
    ignore:
      - dependency-name: "golang"
        versions: [">= 1.27"]
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

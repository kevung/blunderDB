name: Publish to Homebrew tap

# Pushes the rendered Homebrew cask to the kevung/homebrew-tap repository
# after a GitHub release. OPT-IN: requires the repo secret
# HOMEBREW_TAP_TOKEN (a GitHub token with write access to
# kevung/homebrew-tap) AND the tap repository itself — neither exists until a
# human creates them once, see packaging/homebrew/README.md §2-3. Without the
# secret the job runs but no-ops (see the "guard" step), so it never fails a
# release.
#
# TRIGGER: `workflow_run` on the completion of "Wails build", exactly like
# aur.yml and for the same reason — the release is created by build.yml using
# the default GITHUB_TOKEN, and events raised by that token never cascade
# into another workflow, so a `release: published` trigger would silently
# never fire. `workflow_run` is raised by GitHub itself when the run
# finishes, whatever token it used, and runs in the context of the default
# branch with full access to repository secrets.
#
# It fires for every completed "Wails build" (pull requests, merges on main,
# tags): the job-level `if` drops everything but tag pushes, and the version
# step insists on an X.Y.Z tag. It does NOT require the run to have
# succeeded, matching aur.yml: the cask asset either exists on the release or
# never will, and the download step fails loudly if it does not.
#
# The rendered cask (blunderdb-<version>.rb) is produced by the
# `package-manifests` job of build.yml and attached to the release; this
# workflow only downloads and re-publishes it, it does not render anything
# itself.

on:
  workflow_run:
    workflows: ["Wails build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Released tag to publish (e.g. 0.35.0)
        required: true

# The job pushes to kevung/homebrew-tap over HTTPS with its own token, never
# to this repository: the GITHUB_TOKEN only reads the release asset.
permissions:
  contents: read

jobs:
  homebrew-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # head_branch carries the tag name for a tag push; `main` is a merge.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch != 'main'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # On workflow_run the default checkout is the default branch; take
          # the tagged commit so error messages line up with the release.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Guard on Homebrew tap secret
        id: guard
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        id: v
        if: steps.guard.outputs.enabled == 'true'
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
          else
            version="$RUN_BRANCH"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "'$version' is not a version tag — skipping Homebrew tap publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Download the rendered cask
        id: dl
        if: steps.v.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          asset="blunderdb-${VERSION}.rb"
          # The build run is complete, so the asset is either there or never
          # will be; the short retry only absorbs the release API's eventual
          # consistency right after package-manifests uploads it.
          for i in $(seq 1 6); do
            if gh release download "$VERSION" -R "$GITHUB_REPOSITORY" -p "$asset" -D dl --clobber 2>/dev/null; then
              break
            fi
            echo "asset $asset not visible yet (attempt $i); waiting..."
            sleep 10
          done
          test -f "dl/$asset" || { echo "::error::$asset is not on release $VERSION — did package-manifests fail?"; exit 1; }

      - name: Push the cask to the tap
        if: steps.v.outputs.enabled == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/kevung/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp "dl/blunderdb-${VERSION}.rb" tap/Casks/blunderdb.rb
          cd tap
          if git diff --quiet -- Casks/blunderdb.rb; then
            echo "Casks/blunderdb.rb already up to date for ${VERSION}."
            exit 0
          fi
          git config user.name "blunderDB release bot"
          git config user.email "blunderdb@proton.me"
          git add Casks/blunderdb.rb
          git commit -m "blunderdb ${VERSION}"
          git push

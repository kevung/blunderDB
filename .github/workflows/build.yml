name: Wails build

on:
  push:
    branches:
      - main
    tags:
      # Version tags only (e.g. 0.31.0). Data-asset tags such as
      # bearoff-data-1 must NOT trigger the release matrix.
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

# One in-flight run per branch/tag: a burst of 3 commits collapses to the
# latest instead of running 3 full matrices. Only pull_request runs cancel a
# stale in-progress run when superseded — push runs on main/tags always run
# to completion (a merge shouldn't cancel the build the previous merge
# started, and a tag build must never be cancelled by the next one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to read-only; jobs that publish (release assets, GitHub Pages)
# elevate locally with their own `permissions:` block.
permissions:
  contents: read

jobs:
  # The Go suite is sharded so the wall clock is bounded by the slowest shard
  # (about 6 minutes on a 4-vCPU runner) instead of their sum (20 minutes
  # measured on 2026-09-02). Shards select packages by path, so a new package
  # lands in `rest` without editing this file; `database` is one package
  # carrying ten minutes of race-instrumented tests, so it is split by test
  # name instead. engine/gammonnet runs without the race detector and with
  # `-covermode=set`: atomic counters cost it five times its run time.
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: database-a
            run: go test -timeout 1200s -race -count=1 -run '^Test[A-I]' -coverprofile=coverage.out -covermode=atomic ./pkg/blunderdb/database/ 2>&1 | tee test-output.txt
          - shard: database-b
            run: go test -timeout 1200s -race -count=1 -run '^Test[^A-I]' -coverprofile=coverage.out -covermode=atomic ./pkg/blunderdb/database/ 2>&1 | tee test-output.txt
          - shard: app
            run: go test -timeout 1200s -race -count=1 -coverprofile=coverage.out -covermode=atomic . ./internal/... ./cmd/... 2>&1 | tee test-output.txt
          # -coverpkg=./pkg/blunderdb/... (E.2, #218): this shard is what
          # exercises storage/sqlite, and storage/sqlite calls into
          # storage/sqlshared — without -coverpkg only the package under test
          # gets attributed, so sqlshared's own lines executed on its behalf
          # showed as 1.4% covered (measured 2026-09, only rebind_test.go's
          # direct calls counted). Widening the scope costs ~10s locally.
          - shard: rest
            run: |
              go vet ./...
              go test -timeout 1200s -race -count=1 -coverpkg=./pkg/blunderdb/... -coverprofile=coverage.out -covermode=atomic \
                $(go list ./pkg/... ./tests/... | grep -v '/pkg/blunderdb/database$' | grep -v '/pkg/blunderdb/engine/gammonnet$') 2>&1 | tee test-output.txt
          # -short on pushes and pull requests (~30 s: the 2-ply searches behind
          # testing.Short() are skipped), the full suite on version tags.
          - shard: gammonnet
            run: go test -timeout 1500s -count=1 $GAMMONNET_FLAGS -coverprofile=coverage.out -covermode=set ./pkg/blunderdb/engine/gammonnet/ 2>&1 | tee test-output.txt
          # Every Fuzz* target of the module in seed mode: without -fuzz, `go
          # test` replays the f.Add seeds and the committed testdata/fuzz/
          # corpora (the regression inputs of past crashes) as plain tests.
          # `-run` filters Fuzz* names too, so a shard selecting by test name
          # like database-a/-b silently drops them — this shard is the one
          # place that guarantees they run, whatever the other shards filter
          # on. Packages are discovered from the sources so a new target needs
          # no edit here; -v is deliberate: the log must show every
          # `FuzzXxx/seed#N`. fuzz.yml does the open-ended search.
          - shard: fuzz-seeds
            run: |
              pkgs=$(grep -rl --include='*_test.go' '^func Fuzz' . | xargs -n1 dirname | sed 's|^\./||; s|^|./|' | sort -u)
              echo "fuzz packages: $pkgs"
              go test -timeout 600s -race -count=1 -run '^Fuzz' -v $pkgs 2>&1 | tee test-output.txt
    env:
      GAMMONNET_FLAGS: ${{ startsWith(github.ref, 'refs/tags/') && '' || '-short' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: Run Go tests (${{ matrix.shard }})
        run: ${{ matrix.run }}
        shell: bash

      - name: Upload coverage shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage-${{ matrix.shard }}
          path: coverage.out
          if-no-files-found: ignore

      # `go test` prints one "ok/FAIL <pkg> <elapsed>" line per package even
      # without -v (verified locally); `tee` above kept a copy next to the
      # per-shard exit code, so the coverage job's summary can name the
      # slowest packages without a second, dedicated timing run (E.2, #218).
      - name: Upload package timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkg-times-${{ matrix.shard }}
          path: test-output.txt
          if-no-files-found: ignore

  # Merges the per-shard profiles into the single go-coverage artifact the
  # summary reads, checks the merged total against a non-regressive floor,
  # and reports the slowest packages (E.2, #218 — this used to be visibility
  # only, no threshold, and merged even when a shard was red).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, test-postgres]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.25.13
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: Download coverage shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: go-coverage-*
          path: shards

      - name: Download package timings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pkg-times-*
          path: timings

      # Non-regressive floor (E.2, #218): 51% is where the merged total sat
      # on 2026-09-03 (measured ~70% without -race locally, comfortably
      # above — the margin covers the drift race-instrumented runs and a
      # still-missing test-postgres run add). A number below that is a real
      # regression, not noise, and now fails the job instead of only being
      # printed. When an upstream shard was red the merge still runs (so the
      # partial numbers stay visible) but the summary says so plainly instead
      # of presenting them as a clean run.
      - name: Merge coverage profiles
        run: |
          first=1
          for f in shards/*/coverage.out; do
            [ -f "$f" ] || continue
            if [ $first = 1 ]; then cat "$f" > coverage.out; first=0; else tail -n +2 "$f" >> coverage.out; fi
          done

          floor=51
          floor_failed=0
          if [ -f coverage.out ]; then
            echo '### Go coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
            if awk -v t="$total" -v f="$floor" 'BEGIN{exit !(t < f)}'; then
              echo "::error::Couverture totale ${total}% sous le plancher non régressif de ${floor}%."
              echo "**Couverture totale ${total}% — sous le plancher de ${floor}%.**" >> "$GITHUB_STEP_SUMMARY"
              floor_failed=1
            else
              echo "Couverture totale ${total}% (plancher ${floor}%)." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::error::Aucun profil de couverture reçu — impossible de vérifier le plancher de ${floor}%."
            floor_failed=1
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::warning::le job test n'a pas fini vert (${{ needs.test.result }}) — la couverture ci-dessus est mesurée sur un run partiel."
            echo "> ⚠️ Un shard du job \`test\` a échoué (${{ needs.test.result }}) : la couverture ci-dessus ne provient pas d'un run entièrement vert." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ needs.test-postgres.result }}" != "success" ]; then
            echo "::warning::test-postgres n'a pas fini vert (${{ needs.test-postgres.result }})."
            echo "> ⚠️ \`test-postgres\` a échoué (${{ needs.test-postgres.result }}) : sa part de la couverture (storage/postgres, migrate) manque ou est partielle." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo '### 10 paquets les plus lents' >> "$GITHUB_STEP_SUMMARY"
          echo '| Paquet | Durée |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          { grep -hE '^(ok|FAIL)[[:space:]]+[^[:space:]]+[[:space:]]+[0-9]+\.[0-9]+s' timings/*/test-output.txt 2>/dev/null || true; } \
            | awk '{d=$3; sub(/s$/, "", d); print d, $2}' \
            | sort -rn \
            | head -10 \
            | awk '{printf "| `%s` | %ss |\n", $2, $1}' >> "$GITHUB_STEP_SUMMARY"

          if [ "$floor_failed" = "1" ]; then
            exit 1
          fi
        shell: bash

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

  # Parallelism is an invariant nothing else guards between two tags (C.2,
  # #189): the `gammonnet` shard above deliberately runs without -race
  # (atomic counters cost it five times its run time, per the shard's own
  # comment) and skips its parallel/concurrent tests under -short, which
  # every push and PR passes — so on an ordinary push, nothing ever runs
  # TestParallelSearchIsBitIdentical or TestConcurrentSearchesAgree under the
  # race detector at all, and the search gold file (gammonnet-gold in
  # fuzz.yml) never runs at push time either. This job is deliberately
  # narrow — only tests whose name matches Parallel/Concurrent/Batch, no
  # -short — so it can afford -race on every push without becoming the new
  # bottleneck shard: measured 2026-09, ~43s, dominated by
  # TestKernelIdentityOnPartialBatches (the batched evaluator's own
  # concurrency-relevant path — CLAUDE.md's "the network kernel never fuses
  # and never reassociates" invariant, exercised here under the race
  # detector rather than just for bit-identity).
  race-gammonnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: go test -race (parallel/concurrent/batch search paths)
        run: go test -race -count=1 -run 'Parallel|Concurrent|Batch' -v -timeout 300s ./pkg/blunderdb/engine/gammonnet/
        shell: bash

  # Runs the shared storage contract, RLS and SQLite→PostgreSQL migration
  # tests against a real PostgreSQL via testcontainers-go. These live behind
  # the `postgres` build tag (see postgres_test.go) because they need Docker;
  # BLUNDERDB_REQUIRE_PG=1 turns the tests' "Docker unavailable" skip into a
  # hard failure so a broken runner can't silently skip the whole suite.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLUNDERDB_REQUIRE_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      # -coverpkg/-coverprofile (E.2, #218): this job used to run with no
      # coverage flag at all, so storage/postgres showed 0% in the merged
      # report even though this is the only job that exercises it — the
      # `coverage` job's Merge step now waits on this job too and downloads
      # its profile the same way it does the `test` matrix's.
      - name: Run PostgreSQL storage + migration tests
        run: |
          go test -tags postgres -timeout 1200s -count=1 -coverpkg=./pkg/blunderdb/... -coverprofile=coverage.out -covermode=atomic \
            ./pkg/blunderdb/storage/postgres/... ./pkg/blunderdb/migrate/... 2>&1 | tee test-output.txt
        shell: bash

      - name: Upload coverage shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage-postgres
          path: coverage.out
          if-no-files-found: ignore

      - name: Upload package timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkg-times-postgres
          path: test-output.txt
          if-no-files-found: ignore

  # The Go suite on the two other desktop platforms. `test` above is
  # Linux-only, yet the binary ships for Windows and macOS with OS-specific
  # code (filelock_windows.go, diskspace_windows.go, the host-capability
  # probes of ADR-0004). -short keeps it cheap: the 2-ply gammonnet searches
  # and the schema benchmarks skip themselves, everything else runs. No -race
  # (the race detector's slowdown is what this job avoids, and `test`
  # already covers it). The PostgreSQL tests sit behind the `postgres` build
  # tag, so the absence of Docker on these runners changes nothing.
  #
  # `continue-on-error` was removed 2026-09 (E.1, #217): the first real runs
  # were green (Windows 154 s, macOS 139 s) and this job is now a prealable
  # of C.2/#189 and of the arm64 NEON follow-up (#151) — it must actually
  # block a red run, not just log one.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings at checkout
        run: git config --global core.autocrlf false
        shell: bash

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: Run Go tests (short, no race)
        run: go test -short -count=1 -timeout 1500s ./...
        shell: bash

      # Named separately from the suite above for visibility (C.2, #189):
      # macOS runners are arm64, the one platform with no accelerated kernel
      # (NEON is #151, still open), so this is ADR-0024's bit-identity gate
      # actually exercising the pure-Go fallback rather than AVX2. `-short`
      # matches the step above (it only shrinks one sweep's span, nothing is
      # skipped); the full, non-short sweep runs weekly (fuzz.yml, C.2/#189).
      - name: Kernel identity (arm64 pure-Go fallback)
        if: runner.os == 'macOS'
        run: go test -short -count=1 -run 'TestKernelIdentity' -v -timeout 300s ./pkg/blunderdb/engine/gammonnet/
        shell: bash

  # ADR-0004 backstop: run the Go suite in a host stripped of every OPTIONAL
  # capability (no clipboard tool, no fonts, an exotic locale). Catches code
  # that inline-assumes a host facility and only fails when it is truly absent —
  # what the per-policy unit tests forgot to simulate. See Dockerfile.hostile.
  hostile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build & run the hostile backstop image
        run: docker build -f Dockerfile.hostile -t blunderdb-hostile .
        shell: bash

  # Container image of the headless daemon (Dockerfile.serve, see
  # doc/source/mode_headless.rst). Every PR/push builds it for linux/amd64 +
  # linux/arm64 as a compile check (E.7, #223 — arm64 used to only be built on
  # a tag, so a cross-compile regression there was found a release too late);
  # a version tag also pushes ghcr.io/kevung/blunderdb-serve:<tag> and
  # :latest. No QEMU: the Dockerfile cross-compiles from the build platform,
  # so both architectures come out of one native `go build` each. GITHUB_TOKEN
  # publishes the package — packages: write is scoped to this job only.
  docker-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kevung/blunderdb-serve
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR (release tags only)
        if: env.IS_TAG == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the version tag itself (0.34.0) and `latest`, on tag pushes only.
      # Labels: metadata-action fills the OCI annotations from the repository —
      # org.opencontainers.image.source / .version / .revision / .licenses (MIT,
      # read from the repo licence) / .created / .title / .description.
      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ env.IS_TAG == 'true' }}
            type=sha,enable=${{ env.IS_TAG != 'true' }}
          labels: |
            org.opencontainers.image.title=blunderDB serve
            org.opencontainers.image.description=Headless blunderDB engine (HTTP + JSON daemon). No authentication — run behind an authenticating reverse proxy.
            org.opencontainers.image.licenses=MIT

      # provenance/sbom (E.7, #223): buildx attaches an in-toto SLSA
      # provenance predicate and a syft SBOM to the pushed image as OCI
      # referrers/attestation manifests — only meaningful for a pushed image,
      # so both are off when this build is push:false (every PR and every
      # push to main). `false` is an explicit string here, not an omission:
      # docker/build-push-action defaults provenance to `mode=max` even
      # without push, which then fails because there is nowhere to attach it.
      - name: Build (and push on a release tag)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.serve
          platforms: linux/amd64,linux/arm64
          push: ${{ env.IS_TAG == 'true' }}
          provenance: ${{ env.IS_TAG == 'true' }}
          sbom: ${{ env.IS_TAG == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A multi-platform build above cannot be `load`ed into the local Docker
      # engine (the docker exporter refuses a manifest list) and, off a tag,
      # is not pushed either — so scanning and the readiness smoke test below
      # need their own single-arch (native, linux/amd64) build. On a tag this
      # reuses the GHA cache from the build above almost entirely; off a tag
      # it IS the only linux/amd64 image this job produces anywhere.
      - name: Build linux/amd64 image for scan + smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.serve
          platforms: linux/amd64
          load: true
          tags: blunderdb-serve:scan
          cache-from: type=gha

      # Non-blocking (E.7, #223 — "trivy sur l'image (non bloquant d'abord)"):
      # surfaces known CVEs in the base image/Go modules without failing a
      # build over a vulnerability nobody has triaged yet. Tighten to
      # `exit-code: '1'` once a baseline pass has been reviewed.
      - name: Trivy image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blunderdb-serve:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      # The image is never actually started anywhere else in CI (E.7, #223):
      # this is the first time anyone runs it, catching a broken ENTRYPOINT or
      # a /readyz that never comes up, not just "it compiled". sqlite keeps
      # the smoke test to one container with no external dependency; /data is
      # already owned by the nonroot user the Dockerfile creates it for.
      - name: Smoke test (docker run + /readyz)
        run: |
          set -euo pipefail
          docker run --rm -d --name blunderdb-smoke -p 127.0.0.1:8080:8080 \
            -e BLUNDERDB_BACKEND=sqlite -e BLUNDERDB_DSN=/data/blunderdb.db \
            blunderdb-serve:scan
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          docker logs blunderdb-smoke || true
          docker stop blunderdb-smoke >/dev/null
          if [ "$ready" -ne 1 ]; then
            echo "::error::/readyz never answered within 30s"
            exit 1
          fi
          echo "/readyz answered within 30s — image starts and serves."
        shell: bash

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '23.4.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` always deletes and relinks node_modules from scratch (E.8,
      # #224 — measured ~25s here even with setup-node's own npm-download
      # cache, which only caches the tarballs, not the extracted/linked
      # tree). Caching the tree itself and skipping the reinstall on a hit
      # is the standard actions/cache pattern; every frontend-* job below
      # repeats it with the same key so a lockfile change invalidates all
      # three together.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
        shell: bash

      # A single `vitest run --coverage` (E.8, #224): this job used to run
      # the suite twice — once plain, once with --coverage behind
      # continue-on-error so a coverage-instrumentation issue could never
      # mask a real failure — but --coverage does not change which tests run
      # or how they're judged, only which lines get counted alongside them,
      # so the second run bought no signal, just ~half the job's own wall
      # time. One authoritative run: a real test failure fails the job.
      - name: Frontend tests (with coverage)
        working-directory: frontend
        run: npm test -- --coverage
        shell: bash

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '23.4.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Same node_modules cache as frontend-test above (E.8, #224) — kept
      # separate from the Playwright browser cache just below, which keys on
      # the resolved @playwright/test version rather than the whole lockfile.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
        shell: bash

      - name: Resolve @playwright/test version
        id: playwright-version
        working-directory: frontend
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium
        shell: bash

      - name: Install Playwright OS dependencies
        working-directory: frontend
        run: npx playwright install-deps chromium
        shell: bash

      - name: Frontend E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true
        shell: bash

      # `retries: 2` (CI only, playwright.config.js) can turn a genuinely
      # broken spec green — Playwright reports it "flaky", not "failed", the
      # moment a retry passes. D.13 (#214): treat that as a real instability
      # signal instead of letting the retry silently absorb it.
      - name: Frontend E2E flaky-spec gate
        working-directory: frontend
        run: npm run check:e2e-flaky
        shell: bash

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/

  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '23.4.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Same node_modules cache as frontend-test/frontend-e2e above (E.8, #224).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
        shell: bash

      - name: Frontend lint
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
        shell: bash

      # `npm run lint`/`format:check` above never look at `npm run build`'s own
      # Svelte-compiler warnings (a11y roles, stale-closure reactivity bugs,
      # unused CSS selectors, …) — 35 of them shipped silently until #205.
      # This does not require a full `vite build`: it compiles every .svelte
      # file with the compiler directly and fails if the count exceeds the
      # ceiling in frontend/.svelte-warnings-budget (see that script's doc
      # comment). The ceiling is lowered, never raised, as warnings get fixed.
      - name: Frontend Svelte compiler warnings budget
        working-directory: frontend
        run: npm run check:svelte-warnings
        shell: bash

      # jsconfig.json turns on `checkJs: true`, but nothing had ever run
      # svelte-check itself in CI (D.13, #214) — so JS type errors across the
      # whole frontend accumulated with a green build the whole time. Same
      # ceiling pattern as the Svelte-warnings budget just above: fails only
      # if the error count exceeds frontend/.svelte-check-budget, lowered
      # (never raised) as errors get fixed.
      - name: Frontend svelte-check type budget
        working-directory: frontend
        run: npm run check:types
        shell: bash

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.11.4

      # The default pass above never sees the `postgres` build tag, so the 16
      # files behind it (storage/postgres, migrate, one server test) were
      # neither vetted nor linted (E.2, #218). golangci-lint's own action only
      # runs the plain invocation, so the tagged pass is a separate step using
      # the CLI it just installed.
      - name: golangci-lint (postgres build tag)
        run: golangci-lint run --build-tags postgres ./...
        shell: bash

      # `filelock_windows.go` and `diskspace_windows.go` (storage/sqlite,
      # database) never build on this Linux runner's default GOOS, so `go
      # vet` above them never ran (E.1, #217) — cross-compiled vet catches
      # what `test-os` (build-only on Windows via `go test`) does not
      # specifically call out.
      - name: go vet (GOOS=windows)
        run: GOOS=windows go vet ./...
        shell: bash

      # The app version lives in three files (doc/source/conf.py,
      # frontend/src/stores/metaStore.js, wails.json); scripts/release.sh
      # keeps them together and its --check exits 1 if they drift apart.
      # The comparison with the latest tag it also prints is informational.
      - name: Version strings in sync
        run: scripts/release.sh --check
        shell: bash

  # Blocking, as CLAUDE.md states: a known vulnerability in a dependency
  # fails the run. Bumping the offending module (or documenting a
  # verified non-reachability) is the way out, not a green-through-red job.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: 1.25.13
          check-latest: true
          repo-checkout: false

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Read-only token (the workflow default): this matrix runs on every pull
    # request and push. Attaching the binaries to the GitHub release is done
    # by the tag-only `release` job below, from the artifacts uploaded here.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set outputs
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # Setup and configure GoLang
      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true
      - run: go version
        shell: bash

      # Setup and configure NodeJS
      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: v23.4.0
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # install wails
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
        shell: bash

      - name: Install UPX
        if: runner.os == 'Windows'
        uses: crazy-max/ghaction-upx@db8cc9515a4a7ea1b312cb82fbeae6d716daf777 # v3.2.0
        with:
          install-only: true

      - name: Install Linux Wails deps for libwebkit2gtk-4.0
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install libgtk-3-0 libwebkit2gtk-4.0-dev gcc-aarch64-linux-gnu
        shell: bash

      - name: Install Linux Wails deps for libwebkit2gtk-4.1
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install libgtk-3-0 libwebkit2gtk-4.1-dev gcc-aarch64-linux-gnu
        shell: bash

      - name: Build App Linux for libwebkit2gtk-4.0
        if: matrix.os == 'ubuntu-22.04'
        run: wails build --platform 'linux' -o blunderDB-linux-${{ steps.vars.outputs.version }} -upx -clean -ldflags "-X github.com/kevung/blunderdb/internal/cli.appVersion=${{ steps.vars.outputs.version }}"
        shell: bash

      - name: Build App Linux for libwebkit2gtk-4.1
        if: matrix.os == 'ubuntu-latest'
        run: wails build --platform 'linux' -o blunderDB-linux-webkit2gtk-4.1-${{ steps.vars.outputs.version }} -upx -clean -tags webkit2_41 -ldflags "-X github.com/kevung/blunderdb/internal/cli.appVersion=${{ steps.vars.outputs.version }}"
        shell: bash

      - name: Build App Windows
        if: runner.os == 'Windows'
        run: wails build --platform 'windows' -o blunderDB-windows-${{ steps.vars.outputs.version }}.exe -upx -clean -tags webkit2_41 -ldflags "-X github.com/kevung/blunderdb/internal/cli.appVersion=${{ steps.vars.outputs.version }}"
        shell: bash

      # Note: Windows binaries are not code-signed. Free OSS Authenticode signing
      # via the SignPath Foundation was applied for but the application was
      # declined, and paid EV certificates are out of scope for this free project.
      # Users mitigate the SmartScreen warning manually (see the Windows security
      # appendix in the docs) and can verify the published .sha256 checksum.

      - name: Build App MacOS
        if: runner.os == 'macOS'
        run: |
          # Rename the bundle so CFBundleExecutable ({{.Name}}) matches the actual
          # binary name. info.productVersion is NOT set here: scripts/release.sh
          # commits it into wails.json at release time, so every platform builds
          # with the same version rather than macOS alone getting a real one.
          VERSION="${{ steps.vars.outputs.version }}"
          OUTPUT_NAME="blunderDB-macos-${VERSION}"
          if command -v jq &> /dev/null; then
            jq --arg n "$OUTPUT_NAME" \
              '.name = $n | .outputfilename = $n' \
              wails.json > wails.json.tmp && mv wails.json.tmp wails.json
          else
            sed -i '' "s/\"name\": \"[^\"]*\"/\"name\": \"$OUTPUT_NAME\"/" wails.json
            sed -i '' "s/\"outputfilename\": \"[^\"]*\"/\"outputfilename\": \"$OUTPUT_NAME\"/" wails.json
          fi
          wails build --platform 'darwin/universal' -clean -tags webkit2_41 -ldflags "-X github.com/kevung/blunderdb/internal/cli.appVersion=$VERSION"
        shell: bash
        
      - name: Add Linux perms
        if: runner.os == 'Linux'
        run: chmod +x build/bin/*
        shell: bash

      # Ship a .tar.gz alongside each raw Linux binary: extracting a tarball
      # preserves the execute bit, so novices no longer need `chmod +x`. The
      # binary keeps its name, `blunderDB`, with a `blunderdb` symlink next to
      # it — the lowercase name the CLI documentation and every package (.deb,
      # .rpm, AUR, Flatpak, cask, winget) use. The archive also carries the
      # .desktop entry, icon, metainfo, INSTALL notes, LICENSE and the
      # third-party notices the embedded licences require (THIRD_PARTY.md).
      - name: Package Linux tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for bin in build/bin/blunderDB-linux-*; do
            [ -f "$bin" ] || continue
            base="$(basename "$bin")"
            tmp="$(mktemp -d)"
            stage="$tmp/$base"
            mkdir -p "$stage"
            cp "$bin" "$stage/blunderDB"
            chmod +x "$stage/blunderDB"
            ln -s blunderDB "$stage/blunderdb"
            cp build/linux/blunderdb.desktop build/linux/blunderdb-256.png \
               build/linux/io.github.kevung.blunderDB.metainfo.xml \
               build/linux/INSTALL.txt LICENSE THIRD_PARTY.md "$stage/"
            tar -czf "build/bin/${base}.tar.gz" -C "$tmp" "$base"
            rm -rf "$tmp"
          done

      # Build native .deb and .rpm from the webkit2gtk-4.1 binary via nfpm (a
      # single spec, no dpkg-deb/rpmbuild). Installs the bit +x, menu entry,
      # icon and the right webkit dependency per distro. Only the 4.1 variant is
      # packaged; older distros keep the raw binary + tar.gz.
      - name: Build .deb and .rpm (webkit2gtk-4.1)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          export PATH="$PATH:$(go env GOPATH)/bin"
          # nfpm does not expand env vars in the `src` glob, so stage the binary
          # at the fixed path nfpm.yaml expects, then remove the bare copy so it
          # is not uploaded to the release.
          cp "build/bin/blunderDB-linux-webkit2gtk-4.1-${VERSION}" build/bin/blunderDB
          # `blunderdb completion <shell>` prints the script (B.8, #176); generate
          # it here from the binary just staged, rather than committing one, so it
          # can never drift from the subcommand table it reads (handlers()). The
          # CLI path never touches webkit2gtk, so this runs fine on the runner.
          mkdir -p build/linux/completions
          build/bin/blunderDB completion bash > build/linux/completions/blunderdb.bash
          build/bin/blunderDB completion zsh  > build/linux/completions/_blunderdb
          build/bin/blunderDB completion fish > build/linux/completions/blunderdb.fish
          nfpm package -f build/linux/nfpm.yaml -p deb -t "build/bin/blunderdb_${VERSION}_amd64.deb"
          nfpm package -f build/linux/nfpm.yaml -p rpm -t "build/bin/blunderdb-${VERSION}.x86_64.rpm"
          rm -f build/bin/blunderDB

      # Install what was just packaged, on the runner that built it (the
      # webkit2gtk-4.1 deps are already there). A .deb whose symlink points
      # nowhere, or that dropped the third-party notices, used to be found by
      # a user; here `blunderdb version` (the lowercase link, the name the
      # documentation uses) must answer with the version being packaged, and
      # the tarball must extract with the same link and notices.
      - name: Test the Linux packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          sudo dpkg -i "build/bin/blunderdb_${VERSION}_amd64.deb"
          blunderdb version | tee /dev/stderr | grep -F -- "$VERSION"
          test -f /usr/share/doc/blunderdb/THIRD_PARTY.md
          test -f /usr/share/doc/blunderdb/LICENSE
          sudo dpkg -r blunderdb
          tmp="$(mktemp -d)"
          tar -xzf "build/bin/blunderDB-linux-webkit2gtk-4.1-${VERSION}.tar.gz" -C "$tmp"
          dir="$tmp/blunderDB-linux-webkit2gtk-4.1-${VERSION}"
          "$dir/blunderdb" version | grep -F -- "$VERSION"
          test -f "$dir/THIRD_PARTY.md"
          rm -rf "$tmp"

      - name: Add macOS perms
        if: runner.os == 'macOS'
        run: chmod +x build/bin/*/Contents/MacOS/*
        shell: bash

      - name: Build .app zip file
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --keepParent ./build/bin/blunderDB-macos-${{ steps.vars.outputs.version }}.app ./build/bin/blunderDB-macos-${{ steps.vars.outputs.version }}.zip


      # Publish SHA256 checksums alongside each binary so users can verify their
      # download (helps mitigate SmartScreen/antivirus distrust at zero cost).
      # The .sha256 files land in build/bin/ and are picked up by the release
      # glob below. `sha256sum` exists in Git Bash on Windows and on Linux;
      # macOS falls back to `shasum -a 256`. Directories (the .app bundle) are
      # skipped — only the distributable files are hashed.
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd build/bin
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      # Upload build assets. The path hierarchy is preserved after the first
      # wildcard, so the artifact holds build/bin/<asset> — what `release`,
      # `flatpak` and `package-manifests` download and read.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Wails Build ${{matrix.os}} blunderDB ${{ steps.vars.outputs.version }}
          path: |
            */bin/
            *\bin\*

  # Attaches the binaries of the four platforms to the GitHub release, tag
  # pushes only. It is the only job that needs contents:write for them —
  # until 0.36.0 the `build` matrix carried that permission on every pull
  # request and push, for a step it only reached on a tag. The four
  # artifacts are merged back into build/bin/ exactly as `build` left them,
  # .sha256 files included (they are computed next to the binaries in
  # `build` and travel in the artifact), and the release glob is the one the
  # `build` step used, so the release carries the same assets and checksums.
  #
  # The release notes open with an "Installation" block (which of the thirty
  # assets to pick, per system, and how to verify it), written here so that it
  # is never stale: the ADR count is counted in the checkout, not typed. The
  # block sits between `<!-- installation -->` markers; the notes the
  # maintainer writes afterwards (release-blunderdb skill, `gh release edit`)
  # go below it and keep it. If the release already exists with notes, they
  # are kept too — only the block is replaced.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    # softprops/action-gh-release attaches the files to the release; `gh`
    # reads the existing notes with the same token. id-token/attestations
    # are for actions/attest-build-provenance below (E.7, #223): it mints a
    # Sigstore-backed SLSA provenance attestation per asset using GitHub's own
    # OIDC identity — no secret to manage, unlike the opt-in minisign
    # signature a few steps down.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      # The checkout comes first: it cleans the workspace, and it is what the
      # ADR count and the installation block are read from.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the build artifacts of the four platforms
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Wails Build * blunderDB ${{ env.VERSION }}
          merge-multiple: true

      # A release with no asset must fail here, not be discovered by a user:
      # the glob below matches nothing silently if the layout ever changes.
      - name: Inventory of the release assets
        run: |
          set -euo pipefail
          find . -maxdepth 3 -path '*/bin/*' -type f | sort
          n=$(find . -maxdepth 3 -path '*/bin/*' -type f | wc -l)
          test "$n" -gt 0 || { echo "::error::no build asset found under */bin/ — did the build job fail?"; exit 1; }
        shell: bash

      # SLSA build provenance (E.7, #223): one Sigstore-backed attestation
      # per release asset, binding it to this workflow run/commit. Verifiable
      # with `gh attestation verify <file> --repo kevung/blunderDB` — no key
      # to distribute, GitHub's OIDC identity is the trust root. subject-path
      # is built dynamically (same listing as the inventory step above)
      # rather than a static glob, so a new asset never needs an edit here.
      - name: Attest build provenance of the release assets
        id: assets
        run: |
          {
            echo 'paths<<ASSET_PATHS_EOF'
            find . -maxdepth 3 -path '*/bin/*' -type f | sed 's#^\./##'
            echo 'ASSET_PATHS_EOF'
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.paths }}

      # Consolidated checksum manifest (E.7, #223): one SHA256SUMS listing
      # every asset next to the per-file .sha256 the `build` job already
      # produces (kept for anyone verifying a single download) — this is
      # what an optional detached signature below signs, instead of thirty
      # separate .sha256 files.
      - name: Consolidate checksums into SHA256SUMS
        run: |
          set -euo pipefail
          : > SHA256SUMS
          for f in build/bin/*.sha256; do
            [ -f "$f" ] || continue
            cat "$f" >> SHA256SUMS
          done
          sort -k2 -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS
        shell: bash

      # Detached minisign signature over SHA256SUMS (E.7, #223) — OPT-IN,
      # like homebrew-tap.yml's HOMEBREW_TAP_TOKEN guard: without the
      # MINISIGN_SECRET_KEY repo secret this step no-ops and the release
      # ships unsigned exactly as before, so setting it up is never a
      # prerequisite for a release to go out. See
      # packaging/minisign/README.md for the one-time setup (key generation,
      # secret, and committing the public key that verification needs).
      - name: Sign SHA256SUMS with minisign (opt-in)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "MINISIGN_SECRET_KEY not set — SHA256SUMS ships unsigned (see packaging/minisign/README.md)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          tmpkey="$(mktemp)"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$tmpkey"
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | minisign -S -s "$tmpkey" -m SHA256SUMS -x SHA256SUMS.minisig -t "blunderDB ${VERSION}"
          rm -f "$tmpkey"
        shell: bash

      - name: Installation block of the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          adr=$(find docs/adr -maxdepth 1 -name '[0-9]*.md' | wc -l)
          {
            echo '<!-- installation -->'
            echo '## Installation'
            echo
            echo '| System | Take | Then |'
            echo '|---|---|---|'
            echo "| Debian, Ubuntu, Mint | \`blunderdb_${VERSION}_amd64.deb\` | \`sudo apt install ./blunderdb_${VERSION}_amd64.deb\` |"
            echo "| Fedora, openSUSE | \`blunderdb-${VERSION}.x86_64.rpm\` | \`sudo dnf install ./blunderdb-${VERSION}.x86_64.rpm\` |"
            echo "| Arch Linux | AUR \`blunderdb-bin\` | \`yay -S blunderdb-bin\` |"
            echo "| Any Linux | \`blunderDB-${VERSION}.flatpak\`, or the \`webkit2gtk-4.1\` tarball (the plain one on Ubuntu 22.04-era systems) | \`flatpak install ./blunderDB-${VERSION}.flatpak\` |"
            echo "| macOS | \`blunderDB-macos-${VERSION}.zip\` (universal, unsigned: right-click → *Open* the first time) | drag \`blunderDB.app\` to *Applications* |"
            echo "| Windows | \`blunderDB-windows-${VERSION}.exe\` (unsigned: *More info* → *Run anyway*) | run it, nothing to install |"
            echo "| Server | \`ghcr.io/kevung/blunderdb-serve:${VERSION}\` (amd64, arm64) | \`docker pull ghcr.io/kevung/blunderdb-serve:${VERSION}\` |"
            echo
            echo "Every asset has a \`.sha256\` next to it (\`sha256sum -c <asset>.sha256\`) and a consolidated \`SHA256SUMS\`; every asset also carries a build-provenance attestation (\`gh attestation verify <asset> --repo ${GITHUB_REPOSITORY}\`). Full guide, nine languages: https://kevung.github.io/blunderDB/en/telecharge_install.html — winget and Homebrew manifests are attached, not yet submitted. ${adr} architecture decisions are indexed in [docs/adr](https://github.com/kevung/blunderDB/blob/${VERSION}/docs/adr/README.md)."
            echo '<!-- /installation -->'
          } > installation.md
          # Keep whatever notes the release already carries, minus a previous
          # block (a re-run of this job, or notes written before it ran).
          existing=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          {
            cat installation.md
            if [ -n "$existing" ]; then
              echo
              printf '%s\n' "$existing" | sed '/<!-- installation -->/,/<!-- \/installation -->/d'
            fi
          } > release-notes.md
          cat release-notes.md
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          files: |
            */bin/*
            SHA256SUMS
            SHA256SUMS.minisig

  # Flatpak bundle, release tags only. packaging/flatpak/*.yml repackages the
  # webkit2gtk-4.1 release tarball, so the job waits for the matrix (`needs:
  # build`) and takes the tarball from the ubuntu-latest artifact rather than
  # polling the release like aur.yml does. The committed manifest is a template
  # (placeholder url/sha256): a copy is rendered here with a local `path`
  # source and the real checksum, and that copy is what flatpak-builder reads.
  # Runs inside the flathub-infra image, which carries flatpak-builder and the
  # GNOME 47 runtime the manifest names; --privileged is what bubblewrap needs.
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    # softprops/action-gh-release attaches the bundle to the release.
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the Linux build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Wails Build ubuntu-latest blunderDB ${{ env.VERSION }}
          path: dist

      - name: Render the manifest against the release tarball
        run: |
          set -euo pipefail
          asset="blunderDB-linux-webkit2gtk-4.1-${VERSION}.tar.gz"
          src="$(find dist -name "$asset" -type f | head -1)"
          test -n "$src" || { echo "::error::$asset not found in the build artifact"; exit 1; }
          mkdir -p flatpak-build
          cp "$src" "flatpak-build/$asset"
          sha="$(sha256sum "flatpak-build/$asset" | cut -d' ' -f1)"
          sed -e "s#^\( *\)url: .*#\1path: $asset#" \
              -e "s#^\( *\)sha256: .*#\1sha256: $sha#" \
              packaging/flatpak/io.github.kevung.blunderDB.yml \
              > flatpak-build/io.github.kevung.blunderDB.yml
          grep -E '^\s+(path|sha256):' flatpak-build/io.github.kevung.blunderDB.yml
        shell: bash

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak-build/io.github.kevung.blunderDB.yml
          bundle: blunderDB-${{ env.VERSION }}.flatpak
          # A single prebuilt-archive module: nothing worth caching.
          cache: false
          upload-artifact: false

      - name: Checksum
        run: sha256sum "blunderDB-${VERSION}.flatpak" > "blunderDB-${VERSION}.flatpak.sha256"
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            blunderDB-${{ env.VERSION }}.flatpak
            blunderDB-${{ env.VERSION }}.flatpak.sha256

  # winget manifests + Homebrew cask, release tags only. Renders
  # packaging/winget/*.yaml.in and packaging/homebrew/blunderdb.rb.in against
  # the checksums taken from the build artifacts (same reasoning as `flatpak`:
  # no polling of the release) and attaches the results to the release: a zip
  # of the winget manifest tree and the rendered cask. Nothing is submitted to
  # microsoft/winget-pkgs or pushed to a Homebrew tap here — both are steps
  # taken by hand, see packaging/winget/README.md and packaging/homebrew/README.md.
  package-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    # softprops/action-gh-release attaches the files to the release.
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the Windows build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Wails Build windows-latest blunderDB ${{ env.VERSION }}
          path: dist

      - name: Download the macOS build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Wails Build macos-latest blunderDB ${{ env.VERSION }}
          path: dist

      - name: Render the winget manifests and the Homebrew cask
        run: |
          set -euo pipefail
          scripts/winget-render.sh "$VERSION" --assets dist --out out/winget
          scripts/homebrew-render.sh "$VERSION" --assets dist --out out/homebrew
          (cd out/winget && zip -r "../blunderDB-winget-manifests-${VERSION}.zip" manifests)
          cp out/homebrew/Casks/blunderdb.rb "out/blunderdb-${VERSION}.rb"
          cd out
          for f in "blunderDB-winget-manifests-${VERSION}.zip" "blunderdb-${VERSION}.rb"; do
            sha256sum "$f" > "$f.sha256"
          done
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            out/blunderDB-winget-manifests-${{ env.VERSION }}.zip
            out/blunderDB-winget-manifests-${{ env.VERSION }}.zip.sha256
            out/blunderdb-${{ env.VERSION }}.rb
            out/blunderdb-${{ env.VERSION }}.rb.sha256

  # Cheap gate for the `docs` job below: did this push/PR touch anything the
  # documentation build reads? Only doc/** and this workflow can change the
  # output, yet the job used to run on every PR (~10 min, ~1 GB of LaTeX from
  # apt) regardless. Tag pushes and manual runs bypass the gate — see the `if`
  # on `docs` — so the filter is not even evaluated there.
  docs-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    # paths-filter lists a pull request's files through the API (pull-requests:
    # read); on a push it diffs against the commit before the push from the
    # checkout, fetching what it needs itself.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect documentation changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            docs:
              - 'doc/**'
              - '.github/workflows/build.yml'
              - 'scripts/doc-i18n-check.sh'

  # Are the eight translations complete against the French source? Runs
  # scripts/doc-i18n-check.sh (regenerates the .pot, merges each catalogue in a
  # temp dir, counts untranslated + fuzzy). Same gate as `docs`: documentation
  # changes, tags and manual runs. On a pull request or a manual run a gap is
  # a ::warning:: annotation; on a push (main or a version tag) it is strict
  # and fails: a release cannot ship docs falling back to French, and the
  # `pages` job below deploys the site from main only when this job is green
  # (issue #161: eight published sites showed French paragraphs). It blocks
  # nothing else: the release assets come from `build`, which does not depend
  # on it.
  docs-i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docs-changes
    if: >-
      !cancelled() && (
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'workflow_dispatch' ||
        needs.docs-changes.outputs.docs == 'true'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: doc/requirements.txt

      - name: Install Sphinx and GNU gettext
        run: |
          python -m pip install --upgrade pip
          pip install -r ./doc/requirements.txt
          sudo apt-get update && sudo apt-get install -y gettext
        shell: bash

      - name: Check translation coverage
        run: scripts/doc-i18n-check.sh ${{ github.event_name == 'push' && '--strict' || '' }}
        shell: bash

  # Builds the docs in all 9 languages; on a version tag it also builds the
  # PDFs and attaches them to the release. Runs when the gate above saw a
  # documentation change, and unconditionally on tags and manual dispatch
  # (the release must never ship without its docs because a filter was wrong).
  # Deliberately carries NO concurrency group: it used to share the Pages queue,
  # and a merge landing right after a tag push evicted the tag's job (a group
  # holds one pending run at most), so the release silently shipped without its
  # PDFs. Only the deploy needs serializing — see the `pages` job below.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: docs-changes
    # `!cancelled()` replaces the implicit success() so a *skipped* gate (tag,
    # dispatch) does not skip this job too; the rest of the expression is the
    # actual decision.
    if: >-
      !cancelled() && (
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'workflow_dispatch' ||
        needs.docs-changes.outputs.docs == 'true'
      )
    # softprops/action-gh-release below (tag pushes only) needs contents:write
    # to attach the PDFs to the release.
    permissions:
      contents: write
    env:
      # PDFs (LaTeX, nine languages, ~1 GB of apt packages) only on a release
      # tag; a PR or a merge gets the HTML build alone, which is what catches
      # broken RST/translations. build.py honours this variable.
      BUILD_PDF: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: doc/requirements.txt

      - name: Set outputs
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./doc/requirements.txt
        shell: bash

      - name: Install LaTeX (release tags only)
        if: env.BUILD_PDF == '1'
        run: |
          sudo apt-get update && sudo apt-get install -y latexmk texlive-xetex texlive-fonts-recommended texlive-latex-extra fonts-freefont-otf fonts-noto-cjk texlive-lang-cjk
        shell: bash

      - name: Build documentation
        env:
          BLUNDERDB_DOC_SKIP_PDF: ${{ env.BUILD_PDF == '1' && '0' || '1' }}
        run: |
          cd ./doc
          python build.py

      - name: Rename PDF files
        if: env.BUILD_PDF == '1'
        run: |
          for lang in fr en de el es fi it ja ru; do
            find ./doc/build/pdf_${lang}/ -name '*.pdf' -exec mv {} ./doc/build/pdf_${lang}/blunderDB-${{ steps.vars.outputs.version }}-${lang}.pdf \;
          done
        shell: bash

      - name: Create index.html for redirection
        run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=en/"></head><body></body></html>' > ./doc/build/index.html

      # Upload build assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.BUILD_PDF == '1'
        with:
          name: blunderDB pdf docs
          path: |
            */build/pdf_*/*.pdf

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            */build/pdf_*/*.pdf

      # Hand the built site to the `pages` job, which is the only one allowed to
      # queue on gh-pages.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: docs-site
          path: ./doc/build
          retention-days: 1

  # Only publish on push (main / tags); pull_request runs still build the docs
  # above to catch breakage, but must not push to gh-pages — doing so both
  # pollutes the published site and races the real push deploys. When `docs`
  # is skipped (a push that touched no documentation) this job is skipped with
  # it: the site is a pure function of doc/**, so there is nothing new to
  # publish. A push on main also waits for `docs-i18n-check` (strict on a
  # push) and deploys only if it is green: a paragraph left untranslated must
  # not reach the eight translated sites (issue #161). A tag is not gated
  # here — its `docs-i18n-check` is strict too, and a release tag whose
  # translations lag still republishes the site with its release notes.
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docs, docs-i18n-check]
    # !cancelled() is required, not decorative: a skipped ancestor propagates
    # through the whole chain, and docs-changes is skipped on every tag. On the
    # 0.35.0 tag `docs` ran and succeeded while `pages` was skipped anyway; the
    # site was only republished because the main push carried the same commit.
    if: >-
      !cancelled() && github.event_name == 'push' && needs.docs.result == 'success' && (
        startsWith(github.ref, 'refs/tags/') ||
        needs.docs-i18n-check.result == 'success'
      )
    # peaceiris/actions-gh-pages pushes the built site to the gh-pages branch
    # using github_token below — needs contents:write.
    permissions:
      contents: write
    # Serialize Pages deploys so bursts of merges (or a merge racing a tag
    # push) queue instead of colliding on the gh-pages branch. cancel-in-progress
    # stays false: every push should publish, none should be dropped. A deploy
    # dropped here costs nothing durable — the next push republishes the site.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: ./doc/build

      # force_orphan (E.10, #226): every deploy used to add a new commit on
      # top of gh-pages' history, and that branch carries LaTeX build
      # artefacts (.dvi 113 Mio, .doctrees 88 Mio across its history) — a
      # `git clone` of the whole repository (every branch) pulls all of it
      # even though gh-pages is never checked out by anyone. An orphan commit
      # (single commit, no parent) each time stops that history from growing
      # further; it does not shrink what is already there (that needs a
      # one-off history rewrite of gh-pages, out of scope here — see the
      # lighter-clone note in CONTRIBUTING.md instead).
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/build
          publish_branch: gh-pages
          keep_files: false  # This will clean the branch before deploying
          force_orphan: true

name: Wails build

on:
  push:
    branches:
      - main
    tags:
      # Version tags only (e.g. 0.31.0). Data-asset tags such as
      # bearoff-data-1 must NOT trigger the release matrix.
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

# One in-flight run per branch/tag: a burst of 3 commits collapses to the
# latest instead of running 3 full matrices. Only pull_request runs cancel a
# stale in-progress run when superseded — push runs on main/tags always run
# to completion (a merge shouldn't cancel the build the previous merge
# started, and a tag build must never be cancelled by the next one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to read-only; jobs that publish (release assets, GitHub Pages)
# elevate locally with their own `permissions:` block.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GoLang
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: Go vet
        run: go vet ./...
        shell: bash

      # The engine/gammonnet package runs 2-ply searches in its tests: ~50 s
      # natively, but the race detector's 10-20x slowdown pushed it past the
      # 20-minute timeout on every push (main was red from 2026-08-29 to
      # 2026-09-02). It runs on its own, without -race, with the same
      # coverage flags; every other package keeps the race detector.
      - name: Run Go tests (race)
        run: |
          go test -timeout 1200s -race -count=1 -coverprofile=coverage.out -covermode=atomic \
            $(go list ./... | grep -v '/pkg/blunderdb/engine/gammonnet$')
        shell: bash

      - name: Run Go tests (engine/gammonnet, no race)
        run: go test -timeout 900s -count=1 -coverprofile=coverage-gammonnet.out -covermode=atomic ./pkg/blunderdb/engine/gammonnet/
        shell: bash

      - name: Merge coverage profiles
        if: always()
        run: |
          if [ -f coverage-gammonnet.out ]; then
            tail -n +2 coverage-gammonnet.out >> coverage.out
          fi
        shell: bash

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo '### Go coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

  # Runs the shared storage contract, RLS and SQLite→PostgreSQL migration
  # tests against a real PostgreSQL via testcontainers-go. These live behind
  # the `postgres` build tag (see postgres_test.go) because they need Docker;
  # BLUNDERDB_REQUIRE_PG=1 turns the tests' "Docker unavailable" skip into a
  # hard failure so a broken runner can't silently skip the whole suite.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLUNDERDB_REQUIRE_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GoLang
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: Run PostgreSQL storage + migration tests
        run: |
          go test -tags postgres -timeout 1200s \
            ./pkg/blunderdb/storage/postgres/... ./pkg/blunderdb/migrate/...
        shell: bash

  # ADR-0004 backstop: run the Go suite in a host stripped of every OPTIONAL
  # capability (no clipboard tool, no fonts, an exotic locale). Catches code
  # that inline-assumes a host facility and only fails when it is truly absent —
  # what the per-policy unit tests forgot to simulate. See Dockerfile.hostile.
  hostile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & run the hostile backstop image
        run: docker build -f Dockerfile.hostile -t blunderdb-hostile .
        shell: bash

  # Container image of the headless daemon (Dockerfile.serve, see
  # doc/source/mode_headless.rst). Every PR/push builds it for linux/amd64 as
  # a compile check; a version tag builds linux/amd64 + linux/arm64 and pushes
  # ghcr.io/kevung/blunderdb-serve:<tag> and :latest. No QEMU: the Dockerfile
  # cross-compiles from the build platform, so both architectures come out of
  # one native `go build` each. GITHUB_TOKEN publishes the package — packages:
  # write is scoped to this job only.
  docker-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kevung/blunderdb-serve
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR (release tags only)
        if: env.IS_TAG == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the version tag itself (0.34.0) and `latest`, on tag pushes only.
      # Labels: metadata-action fills the OCI annotations from the repository —
      # org.opencontainers.image.source / .version / .revision / .licenses (MIT,
      # read from the repo licence) / .created / .title / .description.
      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ env.IS_TAG == 'true' }}
            type=sha,enable=${{ env.IS_TAG != 'true' }}
          labels: |
            org.opencontainers.image.title=blunderDB serve
            org.opencontainers.image.description=Headless blunderDB engine (HTTP + JSON daemon). No authentication — run behind an authenticating reverse proxy.
            org.opencontainers.image.licenses=MIT

      - name: Build (and push on a release tag)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.serve
          platforms: ${{ env.IS_TAG == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.IS_TAG == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '23.4.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: npm ci && npm test
        shell: bash

      # Non-blocking: no thresholds, coverage is visibility only. Runs after
      # the real test step above so a coverage-instrumentation issue never
      # masks an actual test failure.
      - name: Frontend coverage
        if: always()
        working-directory: frontend
        run: npm test -- --run --coverage
        continue-on-error: true
        shell: bash

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '23.4.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        shell: bash

      - name: Resolve @playwright/test version
        id: playwright-version
        working-directory: frontend
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium
        shell: bash

      - name: Install Playwright OS dependencies
        working-directory: frontend
        run: npx playwright install-deps chromium
        shell: bash

      - name: Frontend E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true
        shell: bash

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # Benchmarks only run on push (main branch or a version tag), never on
  # pull_request: they take minutes and aren't compared against a baseline,
  # so they add latency to every PR for no signal. -run '^$' skips the
  # regular test suite (already covered by the `test` job above); -count=1
  # keeps a single push run fast instead of the previous -count=3.
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GoLang
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run '^$' -count=1 -timeout=10m ./... 2>&1 | tee bench.txt
        shell: bash

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench.txt

  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '23.4.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run format:check
        shell: bash

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GoLang
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      # The app version lives in three files (doc/source/conf.py,
      # frontend/src/stores/metaStore.js, wails.json); scripts/release.sh
      # keeps them together and its --check exits 1 if they drift apart.
      # The comparison with the latest tag it also prints is informational.
      - name: Version strings in sync
        run: scripts/release.sh --check
        shell: bash

  # Blocking, as CLAUDE.md states: a known vulnerability in a dependency
  # fails the run. Bumping the offending module (or documenting a
  # verified non-reachability) is the way out, not a green-through-red job.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.25.13
          check-latest: true
          repo-checkout: false

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # softprops/action-gh-release below (tag pushes only) needs contents:write
    # to attach binaries to the release. GitHub grants permissions per job,
    # not per step, so PR/branch runs carry the same token even though they
    # never reach that step. Narrowing it means moving the Release step to a
    # separate tag-only job that downloads the matrix artifacts — a change
    # that can only be verified on a real tag push, so it is left as is.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set outputs
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # Setup and configure GoLang
      - name: Setup GoLang
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version: 1.25.13
          cache: true
      - run: go version
        shell: bash

      # Setup and configure NodeJS
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: v23.4.0
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # install wails
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
        shell: bash

      - name: Install UPX
        if: runner.os == 'Windows'
        uses: crazy-max/ghaction-upx@db8cc9515a4a7ea1b312cb82fbeae6d716daf777 # v3.2.0
        with:
          install-only: true

      - name: Install Linux Wails deps for libwebkit2gtk-4.0
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install libgtk-3-0 libwebkit2gtk-4.0-dev gcc-aarch64-linux-gnu
        shell: bash

      - name: Install Linux Wails deps for libwebkit2gtk-4.1
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install libgtk-3-0 libwebkit2gtk-4.1-dev gcc-aarch64-linux-gnu
        shell: bash

      - name: Build App Linux for libwebkit2gtk-4.0
        if: matrix.os == 'ubuntu-22.04'
        run: wails build --platform 'linux' -o blunderDB-linux-${{ steps.vars.outputs.version }} -upx -clean -ldflags "-X github.com/kevung/blunderdb/internal/cli.appVersion=${{ steps.vars.outputs.version }}"
        shell: bash

      - name: Build App Linux for libwebkit2gtk-4.1
        if: matrix.os == 'ubuntu-latest'
        run: wails build --platform 'linux' -o blunderDB-linux-webkit2gtk-4.1-${{ steps.vars.outputs.version }} -upx -clean -tags webkit2_41 -ldflags "-X github.com/kevung/blunderdb/internal/cli.appVersion=${{ steps.vars.outputs.version }}"
        shell: bash

      - name: Build App Windows
        if: runner.os == 'Windows'
        run: wails build --platform 'windows' -o blunderDB-windows-${{ steps.vars.outputs.version }}.exe -upx -clean -tags webkit2_41 -ldflags "-X github.com/kevung/blunderdb/internal/cli.appVersion=${{ steps.vars.outputs.version }}"
        shell: bash

      # Note: Windows binaries are not code-signed. Free OSS Authenticode signing
      # via the SignPath Foundation was applied for but the application was
      # declined, and paid EV certificates are out of scope for this free project.
      # Users mitigate the SmartScreen warning manually (see the Windows security
      # appendix in the docs) and can verify the published .sha256 checksum.

      - name: Build App MacOS
        if: runner.os == 'macOS'
        run: |
          # Rename the bundle so CFBundleExecutable ({{.Name}}) matches the actual
          # binary name. info.productVersion is NOT set here: scripts/release.sh
          # commits it into wails.json at release time, so every platform builds
          # with the same version rather than macOS alone getting a real one.
          VERSION="${{ steps.vars.outputs.version }}"
          OUTPUT_NAME="blunderDB-macos-${VERSION}"
          if command -v jq &> /dev/null; then
            jq --arg n "$OUTPUT_NAME" \
              '.name = $n | .outputfilename = $n' \
              wails.json > wails.json.tmp && mv wails.json.tmp wails.json
          else
            sed -i '' "s/\"name\": \"[^\"]*\"/\"name\": \"$OUTPUT_NAME\"/" wails.json
            sed -i '' "s/\"outputfilename\": \"[^\"]*\"/\"outputfilename\": \"$OUTPUT_NAME\"/" wails.json
          fi
          wails build --platform 'darwin/universal' -clean -tags webkit2_41 -ldflags "-X github.com/kevung/blunderdb/internal/cli.appVersion=$VERSION"
        shell: bash
        
      - name: Add Linux perms
        if: runner.os == 'Linux'
        run: chmod +x build/bin/*
        shell: bash

      # Ship a .tar.gz alongside each raw Linux binary: extracting a tarball
      # preserves the execute bit, so novices no longer need `chmod +x`. The
      # binary is renamed to `blunderdb` inside the archive and bundled with the
      # .desktop entry, icon and INSTALL notes.
      - name: Package Linux tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for bin in build/bin/blunderDB-linux-*; do
            [ -f "$bin" ] || continue
            base="$(basename "$bin")"
            tmp="$(mktemp -d)"
            stage="$tmp/$base"
            mkdir -p "$stage"
            cp "$bin" "$stage/blunderDB"
            chmod +x "$stage/blunderDB"
            cp build/linux/blunderdb.desktop build/linux/blunderdb-256.png \
               build/linux/io.github.kevung.blunderDB.metainfo.xml \
               build/linux/INSTALL.txt LICENSE "$stage/"
            tar -czf "build/bin/${base}.tar.gz" -C "$tmp" "$base"
            rm -rf "$tmp"
          done

      # Build native .deb and .rpm from the webkit2gtk-4.1 binary via nfpm (a
      # single spec, no dpkg-deb/rpmbuild). Installs the bit +x, menu entry,
      # icon and the right webkit dependency per distro. Only the 4.1 variant is
      # packaged; older distros keep the raw binary + tar.gz.
      - name: Build .deb and .rpm (webkit2gtk-4.1)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          export PATH="$PATH:$(go env GOPATH)/bin"
          # nfpm does not expand env vars in the `src` glob, so stage the binary
          # at the fixed path nfpm.yaml expects, then remove the bare copy so it
          # is not uploaded to the release.
          cp "build/bin/blunderDB-linux-webkit2gtk-4.1-${VERSION}" build/bin/blunderDB
          nfpm package -f build/linux/nfpm.yaml -p deb -t "build/bin/blunderdb_${VERSION}_amd64.deb"
          nfpm package -f build/linux/nfpm.yaml -p rpm -t "build/bin/blunderdb-${VERSION}.x86_64.rpm"
          rm -f build/bin/blunderDB

      - name: Add macOS perms
        if: runner.os == 'macOS'
        run: chmod +x build/bin/*/Contents/MacOS/*
        shell: bash

      - name: Build .app zip file
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --keepParent ./build/bin/blunderDB-macos-${{ steps.vars.outputs.version }}.app ./build/bin/blunderDB-macos-${{ steps.vars.outputs.version }}.zip


      # Publish SHA256 checksums alongside each binary so users can verify their
      # download (helps mitigate SmartScreen/antivirus distrust at zero cost).
      # The .sha256 files land in build/bin/ and are picked up by the release
      # glob below. `sha256sum` exists in Git Bash on Windows and on Linux;
      # macOS falls back to `shasum -a 256`. Directories (the .app bundle) are
      # skipped — only the distributable files are hashed.
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd build/bin
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      # Upload build assets
      - uses: actions/upload-artifact@v4
        with:
          name: Wails Build ${{matrix.os}} blunderDB ${{ steps.vars.outputs.version }}
          path: |
            */bin/
            *\bin\*

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            */bin/*

  # Flatpak bundle, release tags only. packaging/flatpak/*.yml repackages the
  # webkit2gtk-4.1 release tarball, so the job waits for the matrix (`needs:
  # build`) and takes the tarball from the ubuntu-latest artifact rather than
  # polling the release like aur.yml does. The committed manifest is a template
  # (placeholder url/sha256): a copy is rendered here with a local `path`
  # source and the real checksum, and that copy is what flatpak-builder reads.
  # Runs inside the flathub-infra image, which carries flatpak-builder and the
  # GNOME 47 runtime the manifest names; --privileged is what bubblewrap needs.
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    # softprops/action-gh-release attaches the bundle to the release.
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: Wails Build ubuntu-latest blunderDB ${{ env.VERSION }}
          path: dist

      - name: Render the manifest against the release tarball
        run: |
          set -euo pipefail
          asset="blunderDB-linux-webkit2gtk-4.1-${VERSION}.tar.gz"
          src="$(find dist -name "$asset" -type f | head -1)"
          test -n "$src" || { echo "::error::$asset not found in the build artifact"; exit 1; }
          mkdir -p flatpak-build
          cp "$src" "flatpak-build/$asset"
          sha="$(sha256sum "flatpak-build/$asset" | cut -d' ' -f1)"
          sed -e "s#^\( *\)url: .*#\1path: $asset#" \
              -e "s#^\( *\)sha256: .*#\1sha256: $sha#" \
              packaging/flatpak/io.github.kevung.blunderDB.yml \
              > flatpak-build/io.github.kevung.blunderDB.yml
          grep -E '^\s+(path|sha256):' flatpak-build/io.github.kevung.blunderDB.yml
        shell: bash

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak-build/io.github.kevung.blunderDB.yml
          bundle: blunderDB-${{ env.VERSION }}.flatpak
          # A single prebuilt-archive module: nothing worth caching.
          cache: false
          upload-artifact: false

      - name: Checksum
        run: sha256sum "blunderDB-${VERSION}.flatpak" > "blunderDB-${VERSION}.flatpak.sha256"
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            blunderDB-${{ env.VERSION }}.flatpak
            blunderDB-${{ env.VERSION }}.flatpak.sha256

  # Cheap gate for the `docs` job below: did this push/PR touch anything the
  # documentation build reads? Only doc/** and this workflow can change the
  # output, yet the job used to run on every PR (~10 min, ~1 GB of LaTeX from
  # apt) regardless. Tag pushes and manual runs bypass the gate — see the `if`
  # on `docs` — so the filter is not even evaluated there.
  docs-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    # paths-filter lists a pull request's files through the API (pull-requests:
    # read); on a push it diffs against the commit before the push from the
    # checkout, fetching what it needs itself.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect documentation changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            docs:
              - 'doc/**'
              - '.github/workflows/build.yml'
              - 'scripts/doc-i18n-check.sh'

  # Are the eight translations complete against the French source? Runs
  # scripts/doc-i18n-check.sh (regenerates the .pot, merges each catalogue in a
  # temp dir, counts untranslated + fuzzy). Same gate as `docs`: documentation
  # changes, tags and manual runs. On a PR/push a gap is a ::warning::
  # annotation — CLAUDE.md says translations are refreshed at release time —
  # on a version tag it fails, so a release cannot ship docs falling back to
  # French. It marks the run red but blocks nothing else: the release assets
  # come from `build`, which does not depend on it.
  docs-i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docs-changes
    if: >-
      !cancelled() && (
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'workflow_dispatch' ||
        needs.docs-changes.outputs.docs == 'true'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: doc/requirements.txt

      - name: Install Sphinx and GNU gettext
        run: |
          python -m pip install --upgrade pip
          pip install -r ./doc/requirements.txt
          sudo apt-get update && sudo apt-get install -y gettext
        shell: bash

      - name: Check translation coverage
        run: scripts/doc-i18n-check.sh ${{ startsWith(github.ref, 'refs/tags/') && '--strict' || '' }}
        shell: bash

  # Builds the docs in all 9 languages; on a version tag it also builds the
  # PDFs and attaches them to the release. Runs when the gate above saw a
  # documentation change, and unconditionally on tags and manual dispatch
  # (the release must never ship without its docs because a filter was wrong).
  # Deliberately carries NO concurrency group: it used to share the Pages queue,
  # and a merge landing right after a tag push evicted the tag's job (a group
  # holds one pending run at most), so the release silently shipped without its
  # PDFs. Only the deploy needs serializing — see the `pages` job below.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: docs-changes
    # `!cancelled()` replaces the implicit success() so a *skipped* gate (tag,
    # dispatch) does not skip this job too; the rest of the expression is the
    # actual decision.
    if: >-
      !cancelled() && (
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'workflow_dispatch' ||
        needs.docs-changes.outputs.docs == 'true'
      )
    # softprops/action-gh-release below (tag pushes only) needs contents:write
    # to attach the PDFs to the release.
    permissions:
      contents: write
    env:
      # PDFs (LaTeX, nine languages, ~1 GB of apt packages) only on a release
      # tag; a PR or a merge gets the HTML build alone, which is what catches
      # broken RST/translations. build.py honours this variable.
      BUILD_PDF: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: doc/requirements.txt

      - name: Set outputs
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./doc/requirements.txt
        shell: bash

      - name: Install LaTeX (release tags only)
        if: env.BUILD_PDF == '1'
        run: |
          sudo apt-get update && sudo apt-get install -y latexmk texlive-xetex texlive-fonts-recommended texlive-latex-extra fonts-freefont-otf fonts-noto-cjk texlive-lang-cjk
        shell: bash

      - name: Build documentation
        env:
          BLUNDERDB_DOC_SKIP_PDF: ${{ env.BUILD_PDF == '1' && '0' || '1' }}
        run: |
          cd ./doc
          python build.py

      - name: Rename PDF files
        if: env.BUILD_PDF == '1'
        run: |
          for lang in fr en de el es fi it ja ru; do
            find ./doc/build/pdf_${lang}/ -name '*.pdf' -exec mv {} ./doc/build/pdf_${lang}/blunderDB-${{ steps.vars.outputs.version }}-${lang}.pdf \;
          done
        shell: bash

      - name: Create index.html for redirection
        run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=en/"></head><body></body></html>' > ./doc/build/index.html

      # Upload build assets
      - uses: actions/upload-artifact@v4
        if: env.BUILD_PDF == '1'
        with:
          name: blunderDB pdf docs
          path: |
            */build/pdf_*/*.pdf

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            */build/pdf_*/*.pdf

      # Hand the built site to the `pages` job, which is the only one allowed to
      # queue on gh-pages.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: docs-site
          path: ./doc/build
          retention-days: 1

  # Only publish on push (main / tags); pull_request runs still build the docs
  # above to catch breakage, but must not push to gh-pages — doing so both
  # pollutes the published site and races the real push deploys. When `docs`
  # is skipped (a push that touched no documentation) this job is skipped with
  # it: the site is a pure function of doc/**, so there is nothing new to
  # publish.
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docs
    if: github.event_name == 'push'
    # peaceiris/actions-gh-pages pushes the built site to the gh-pages branch
    # using github_token below — needs contents:write.
    permissions:
      contents: write
    # Serialize Pages deploys so bursts of merges (or a merge racing a tag
    # push) queue instead of colliding on the gh-pages branch. cancel-in-progress
    # stays false: every push should publish, none should be dropped. A deploy
    # dropped here costs nothing durable — the next push republishes the site.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: ./doc/build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/build
          publish_branch: gh-pages
          keep_files: false  # This will clean the branch before deploying

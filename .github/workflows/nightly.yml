name: Nightly

# Checks too slow, or too platform-specific, for every push, but distinct
# from what already runs weekly (E.12, #228 — C.2/#189 deferred the decision
# of where these live to this ticket).
#
# Decision: NOTHING that already has a schedule moves here — moving a check
# that already runs regularly, just to have them all "in one file", is churn
# with no reader benefit and risks losing the comment that explains why it
# runs where it does. Concretely, NOT duplicated here:
#   - the search-parity gold file and the arm64 kernel-identity sweep already
#     live in fuzz.yml (gammonnet-gold, gammonnet-kernel-identity-arm64),
#     weekly (Mondays) since C.2; so do the fuzz targets themselves. That
#     file's own header explains why it doesn't need a nightly.yml of its
#     own — read it before adding a third schedule for the same package.
#   - the Trivy image scan lives in build.yml's docker-serve job, on every
#     push (non-blocking) — E.7, #223: an image vulnerability is worth
#     surfacing on the PR that introduced it, not the morning after.
#   - nothing else. The short SQLite loadtest (G.11, #239) IS here now, as
#     the `loadtest` job below.
#
# What IS new here: the full (non -short) Go suite on the two desktop
# platforms build.yml only runs with -short on every push (E.1, #217 — the
# 2-ply gammonnet searches and the schema benchmarks skip themselves under
# -short), a full-package gammonnet run under -race with -short — a
# nightly complement to build.yml's race-gammonnet job, which is deliberately
# narrow (only Parallel/Concurrent/Batch tests) so it can afford -race on
# every push without becoming the bottleneck shard — and the `benchstat` job
# below (E.9, #225): build.yml used to carry a `benchmark` job that ran on
# every push to main and was never compared against anything (115s/push,
# "an artefact nobody compares" — that job is gone, this one replaces it).

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC — fuzz.yml's weekly job runs Mondays 04:00
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          Pull request to post the benchstat comparison to (optional — a
          maintainer checking a suspect PR's performance). Leave empty for an
          ordinary manual run; the nightly schedule never sets this.
        required: false
        type: string

permissions:
  contents: read

# Single statement of the Go version for this file (B.19, #187).
env:
  GO_VERSION: "1.25.13"

jobs:
  test-os-full:
    name: test-os-full (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Belt to .gitattributes' braces (`* -text`, added 2026-09-04): that
      # file is what actually protects the SHA-256-checked embedded assets on
      # every clone, this only covers a runner whose git predates it.
      - name: Keep LF line endings at checkout
        run: git config --global core.autocrlf false
        shell: bash

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      # No -short: the 2-ply gammonnet searches and schema benchmarks that
      # build.yml's test-os job skips every push run here in full, on real
      # Windows/macOS runners rather than only on Linux (the `test` job's
      # `gammonnet` shard already runs the full suite, but only on tag
      # pushes and only on ubuntu-latest).
      - name: Run Go tests (full, no -short, no -race)
        run: go test -count=1 -timeout 1800s ./...
        shell: bash

  gammonnet-race-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Full package, not just Parallel/Concurrent/Batch (build.yml's
      # race-gammonnet): -short keeps the 2-ply searches inside this job's
      # timeout even under the race detector's slowdown.
      - name: go test -race -short (full gammonnet package)
        run: go test -race -short -count=1 -timeout 1200s -v ./pkg/blunderdb/engine/gammonnet/
        shell: bash

  # Benchmark trend gate (E.9, #225). Runs the stable subset (storage/sqlite,
  # storage/sqlshared, engine/gammonnet -short — the packages the plan names
  # as already carrying real benchmarks; B.10/B.11 and C.7-C.10's own gold),
  # then benchstats the fresh run against the versioned tasks/bench/baseline.txt
  # (scripts/bench-compare.sh), failing on a sec/op regression past ±10%.
  #
  # Both sides are -count=1 (a single sample per benchmark, same as the
  # baseline's own generation command below) — see bench-compare.sh's own
  # comment for why the gate reads geomean, not individual per-benchmark
  # significance, at that sample size. -short matches build.yml's push-time
  # gammonnet shard (skips the 2-ply searches) so the baseline stays
  # comparable across both.
  #
  # benchstat is pinned to an exact pseudo-version rather than @latest:
  # golang.org/x/perf carries no tagged releases, so @latest always resolves
  # to HEAD, and HEAD's go.mod (2026-08) requires go >= 1.26 — installing it
  # would silently pull in a second Go toolchain download on every run rather
  # than build with the 1.25.13 this workflow already set up. This pseudo
  # -version's go.mod asks for go 1.18 (verified locally against 1.25.13).
  benchstat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20241118162539-34caac850176
        shell: bash

      - name: Run benchmarks (stable subset)
        run: |
          go test -bench=. -benchmem -run '^$' -short -count=1 -timeout=5m \
            ./pkg/blunderdb/storage/sqlite/... \
            ./pkg/blunderdb/storage/sqlshared/... \
            ./pkg/blunderdb/engine/gammonnet/... \
            > new-bench.txt
        shell: bash

      - name: Compare against baseline (benchstat, ±10% on sec/op geomean)
        id: compare
        run: |
          PATH="$PATH:$(go env GOPATH)/bin" \
            scripts/bench-compare.sh tasks/bench/baseline.txt new-bench.txt 10 pr-comment.md \
            | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload the fresh benchmark run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-new
          path: new-bench.txt
          if-no-files-found: ignore

      # Only when a maintainer dispatched this workflow by hand against a
      # specific PR (see the workflow_dispatch input above) — the nightly
      # schedule never sets pr_number, so an ordinary nightly run never posts
      # here; it still fails the job (and notify-on-failure below still opens
      # a tracking issue) on a real regression.
      - name: Comment on the PR
        if: always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Suivi de performance (benchstat)"
            echo
            cat pr-comment.md
          } > pr-comment-full.md
          gh pr comment "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --body-file pr-comment-full.md
        shell: bash

  # A short loadtest against a real daemon (G.11, #239).
  #
  # SQLite and one tenant: the point is not to measure a fleet, it is to notice
  # the day a change makes the daemon fall over or crawl under a few hundred
  # concurrent requests. The 10 k-tenant PostgreSQL run stays a manual
  # pre-release exercise on a dedicated machine — a shared CI runner cannot
  # produce a number worth comparing, and pretending otherwise would put a
  # meaningless graph in front of whoever reads this.
  #
  # So this job asserts two things a runner CAN answer honestly: the daemon
  # survives the run, and every request it accepted came back 2xx. The report
  # is kept as an artefact for anyone who wants to look at the latencies, and
  # deliberately not gated on a threshold.
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: Run a short loadtest against the daemon
        run: |
          set -euo pipefail
          go build -o /tmp/blunderdb-serve ./cmd/serve
          # --rate-limit-rps 0 disables the per-tenant throttle. With it on,
          # one tenant at a few thousand rps is refused with 429 within the
          # first second and the run measures the limiter rather than the
          # daemon — 58 556 of 59 056 requests, when this was first tried
          # locally. The limiter has its own tests; this job is about what
          # happens behind it.
          /tmp/blunderdb-serve --backend sqlite --db /tmp/loadtest.db --addr 127.0.0.1:8099 --rate-limit-rps 0 &
          serve_pid=$!
          trap 'kill $serve_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8099/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/healthz >/dev/null

          go run ./cmd/blunderdb-loadtest \
            --target http://127.0.0.1:8099 \
            --tenants 1 --concurrency 32 --duration 20s --scenario mixed \
            --output /tmp/loadtest-report.json

          # The daemon must still be alive, and every request it took must have
          # succeeded: a run that "passed" with a third of its requests failing
          # would be a green tick over a broken daemon.
          kill -0 $serve_pid
          python3 - <<'PY'
          import json, sys
          r = json.load(open('/tmp/loadtest-report.json'))
          total = r.get('total_requests') or r.get('totalRequests') or 0
          errors = r.get('errors') or r.get('error_count') or 0
          print(f"{total} requests, {errors} errors")
          if total == 0:
              sys.exit("the loadtest issued no request at all")
          if errors:
              sys.exit(f"{errors} of {total} requests failed")
          PY
        shell: bash

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loadtest-report
          path: |
            /tmp/loadtest-report.json
            /tmp/loadtest-report.md
          if-no-files-found: warn

  # Opens (or reuses) one issue labelled `nightly` when any job above failed
  # — never one per red night, so a multi-day outage does not flood the
  # tracker. A manual, PR-targeted benchstat dispatch (pr_number set) is
  # excluded: that failure already reached the PR via the comment above, and
  # is not the nightly run being red.
  # docs-linkcheck: the documentation's 49 external links are never followed
  # by build.yml (network on every PR is slow and flaky) and had never been
  # followed at all (tasks/critique-doc-2026-09, persona 7 #10). Nightly,
  # French source only (the eight translations carry the same URLs), and
  # advisory: a broken link is a report in the run summary, not a red
  # nightly — sites go down for a night and come back.
  docs-linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: doc/requirements.txt

      - name: Install Sphinx
        run: |
          python -m pip install --upgrade pip
          pip install -r ./doc/requirements.txt

      - name: Follow every external link of the French source
        run: |
          cd doc
          sphinx-build -q -b linkcheck source build/linkcheck || true
          {
            echo "## Documentation link check"
            echo
            if grep -q '"status": "broken"' build/linkcheck/output.json 2>/dev/null; then
              echo '| Page | Link | Reason |'
              echo '|---|---|---|'
              python - <<'PY'
          import json
          for line in open("build/linkcheck/output.json", encoding="utf-8"):
              r = json.loads(line)
              if r.get("status") == "broken":
                  print(f"| {r['filename']}:{r['lineno']} | {r['uri']} | {r['info'].replace('|', '/')} |")
          PY
            else
              echo "No broken link."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          grep -c '"status": "broken"' build/linkcheck/output.json 2>/dev/null && exit 1 || exit 0
        shell: bash

  # The example notebook (I.24, #280). A notebook that is not run is a
  # notebook that has stopped working without anybody noticing: the CSV column
  # it reads was renamed, the CLI flag moved. This job builds a small database
  # from testdata/, exports the three CSVs and executes every cell.
  #
  # It asserts NOTHING about the numbers — they are a fixture's, not a claim.
  # It asserts that the notebook still runs against today's export, which is
  # the only thing that can rot here.
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the notebook's dependencies
        run: python -m pip install --quiet pandas matplotlib nbclient nbformat ipykernel
        shell: bash

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        shell: bash

      - name: Build a database, export it, and run the notebook
        run: |
          set -euo pipefail
          go build -o /tmp/blunderdb .
          work=$(mktemp -d)
          cp notebooks/blunderdb-analyse.ipynb "$work/"

          /tmp/blunderdb create --db "$work/nb.db"
          /tmp/blunderdb import --db "$work/nb.db" --type match --file testdata/test.mat
          # 0-ply: the notebook needs analyses to exist, not to be deep, and a
          # 2-ply sweep of 341 positions is minutes this job should not spend.
          /tmp/blunderdb analyze --db "$work/nb.db" --ply 0
          for kind in positions moves analyses; do
            /tmp/blunderdb list --db "$work/nb.db" --type "$kind" --format csv > "$work/$kind.csv"
          done

          # Every export must have more than its header: an empty CSV would let
          # the notebook "pass" over nothing.
          for kind in positions moves analyses; do
            lines=$(wc -l < "$work/$kind.csv")
            echo "$kind.csv: $lines line(s)"
            [ "$lines" -gt 1 ]
          done

          cd "$work"
          MPLBACKEND=Agg python -c "
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read('blunderdb-analyse.ipynb', as_version=4)
          NotebookClient(nb, timeout=300, kernel_name='python3').execute()
          print('notebook executed')
          "
        shell: bash

  notify-on-failure:
    needs: [test-os-full, gammonnet-race-full, benchstat, loadtest, notebook]
    if: >-
      always() && contains(needs.*.result, 'failure') &&
      !(github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open (or leave) a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "${{ github.repository }}" --label nightly --state open --json number -q '. | length')
          if [ "$existing" -gt 0 ]; then
            echo "An open 'nightly' issue already exists — not creating a duplicate."
            exit 0
          fi
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly failed: $(date -u +%Y-%m-%d)" \
            --label nightly \
            --body "The nightly workflow failed. Run: $RUN_URL"
        shell: bash

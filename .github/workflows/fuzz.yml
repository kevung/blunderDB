name: Fuzz

# Continuous fuzzing of the untrusted-input decoders/mappers. Runs on a weekly
# schedule and on demand — never on push/PR, so it can't flake or block normal
# CI. The seed corpora (f.Add seeds and the committed testdata/fuzz/ regression
# inputs) run on every push and pull request in the `fuzz-seeds` shard of the
# `test` job in build.yml, which discovers every Fuzz* target of the module;
# this job is the open-ended search for *new* crashes. A crash fails the job
# and uploads the minimised input.
#
# The matrix must list every `func Fuzz` of the module
# (grep -rn 'func Fuzz' --include='*_test.go'): a target missing here is never
# fuzzed beyond its seeds.
#
# This file is also where the two gammonNet checks too slow for every push
# live (C.2, #189): `gammonnet-gold` (the search-parity gold file against
# gammonNet's own C reference, ~10.3s plain but a >30x blow-up under -race —
# see the comment on BLUNDERDB_GOLD in gold_test.go) and
# `gammonnet-kernel-identity-arm64` (the full, non -short kernel-identity
# sweep on a real arm64 runner — build.yml's `test-os` macOS job only runs
# the -short quarter of it on every push). That job forces the NEON kernel
# (BLUNDERDB_GAMMONNET_KERNEL=neon), the default on arm64; each green run is
# the proof that it stays bit-identical there. It also runs an informative
# go-against-neon benchstat, with no threshold: a record of the kernel's
# gain, not a gate. The benchstat lives here and
# not in nightly.yml's `benchstat` job because it needs a real arm64 runner
# and only makes sense next to the identity sweep it qualifies; the cost is
# one macOS runner up to 25 minutes a week. Nothing here needed a dedicated
# `nightly.yml` (E.12, #228, still open, will decide where the OTHER
# nightly-only checks land): this file already carries the weekly schedule
# these two need, and workflow_dispatch reruns them on demand like the fuzz
# targets above.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Duration per fuzz target (Go duration, e.g. 90s, 5m) — keep it comfortably below the 12-minute step timeout"
        required: false
        default: "5m"

permissions:
  contents: read

# Single statement of the Go version for this file (B.19, #187).
env:
  GO_VERSION: "1.27.1"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./pkg/blunderdb/parser, target: FuzzParsePosition }
          - { pkg: ./pkg/blunderdb/domain, target: FuzzDecodeXGID }
          - { pkg: ./pkg/blunderdb/engine, target: FuzzDecodeBoardCompact }
          - { pkg: ./pkg/blunderdb/engine, target: FuzzDecodeAnalysisFromStorage }
          - { pkg: ./pkg/blunderdb/ingest, target: FuzzBGFApplyCheckerMove }
          - { pkg: ./pkg/blunderdb/engine/gammonnet, target: FuzzLoadBGNN }
          - { pkg: ./pkg/blunderdb/engine/gammonnet, target: FuzzDecide }
          - { pkg: ./pkg/blunderdb/domain, target: FuzzDecodeOGID }
          - { pkg: ./pkg/blunderdb/searchquery, target: FuzzParse }
          - { pkg: ./pkg/blunderdb/ingest, target: FuzzImportGnuBGMAT }
          - { pkg: ./pkg/blunderdb/ingest, target: FuzzImportGnuBGSGF }
          - { pkg: ./pkg/blunderdb/ingest, target: FuzzImportXG }
          - { pkg: ./pkg/blunderdb/ingest, target: FuzzImportBGF }
          - { pkg: ./pkg/blunderdb/ingest, target: FuzzImportPosition }
          - { pkg: ./pkg/blunderdb/ingest, target: FuzzMATExportRoundTrip }
          - { pkg: ./internal/server, target: FuzzRPC }
          - { pkg: ./internal/server, target: FuzzRunCall }
          - { pkg: ./pkg/blunderdb/transcript, target: FuzzTranscriptGestures }
          - { pkg: ./pkg/blunderdb/database, target: FuzzTranscriptionSession }
    name: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup GoLang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The fuzzing corpus (newly discovered "interesting" inputs) lives under
      # $GOCACHE/fuzz, inside the same directory setup-go's `cache: true`
      # already keys off go.sum — but that cache is written once at restore
      # time and never updated mid-run for fuzz's own subdirectory, so without
      # this dedicated cache every run started from an empty corpus and threw
      # away prior progress (330+ "new interesting" inputs lost per run).
      - name: Cache fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # -fuzztime (5 minutes per target by default) stays well below this
      # step's timeout so the fuzzing engine always gets to shut down cleanly
      # and report its result instead of being killed mid-flight — a
      # step-timeout kill and a "context deadline exceeded" from a
      # still-running worker both used to surface as a failed step even
      # though no crash was ever found. The margin covers the build of the
      # instrumented test binary, the corpus replay before fuzzing starts and
      # the minimisation of a crash. continue-on-error defers the pass/fail
      # call to the next step, which checks for an actual crash artifact.
      - name: Fuzz ${{ matrix.target }}
        id: fuzz
        continue-on-error: true
        timeout-minutes: 12
        run: |
          go test -run '^$' -fuzz "^${{ matrix.target }}$" \
            -fuzztime "${{ github.event.inputs.fuzztime || '5m' }}" \
            ${{ matrix.pkg }}

      # A crash writes a minimized reproducer under testdata/fuzz/<Target>/ —
      # that is the only condition that should fail this job. A timeout or a
      # worker hiccup with no crash artifact is not a bug and must stay green,
      # or the workflow goes back to being permanently (and uselessly) red.
      # Only an UNTRACKED input counts: the committed ones are regression
      # seeds. The directory is searched module-wide because a package whose
      # TestMain changes directory (searchquery moves to the repository root)
      # has its inputs written relative to that directory, not to the package.
      - name: Evaluate fuzz result
        run: |
          set -u
          new=$(git ls-files --others --exclude-standard | grep -E "(^|/)testdata/fuzz/${{ matrix.target }}/" || true)
          if [ -n "$new" ]; then
            echo "::error::Crash artifact found — a real failure was found by fuzzing:"
            echo "$new"
            mkdir -p crash
            echo "$new" | xargs -I{} cp {} crash/
            exit 1
          fi
          if [ "${{ steps.fuzz.outcome }}" = "success" ]; then
            echo "Fuzz target completed cleanly, no crash found."
          else
            echo "Fuzz step did not exit cleanly (timeout or harness hiccup), but no crash artifact was produced — not treated as a failure."
          fi
        shell: bash

      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crash/
          if-no-files-found: ignore

  # The search-parity gate of #121, gated behind BLUNDERDB_GOLD so it never
  # runs on push/PR (gold_test.go explains why: 10.3s plain, still running
  # past 300s under -race — the very reason C.2/#189 keeps this out of
  # build.yml and off -race). Neither package tests main, so no frontend/dist
  # stub is needed here (unlike build.yml's jobs).
  gammonnet-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLUNDERDB_GOLD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup GoLang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Search parity against the gammonNet gold file
        run: go test -count=1 -run '^TestSearchMatchesTheGoldFile$' -v -timeout 300s ./pkg/blunderdb/engine/gammonnet/
        shell: bash

  # The full, non -short kernel_identity_test sweep (span=200 instead of the
  # 48 every push runs, see the comment on TestKernelIdentityOnPartialBatches)
  # on a REAL arm64 runner, with the NEON kernel forced: this job is
  # ADR-0024's proof that NEON, the arm64 default (kernel_arm64.go), stays
  # bit-identical to the pure-Go fallback on Apple Silicon. Forcing it also
  # proves the selector accepts it there; the identity tests compare every
  # accelerated kernel against the fallback whatever the selector says, so
  # build.yml's test-os macOS job checks NEON on the -short quarter at every
  # push. The benchmark pair records what the kernel gains over the fallback
  # (FMUL+FADD, never FMLA, costs about half the fused throughput on Apple
  # cores).
  gammonnet-kernel-identity-arm64:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup GoLang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Kernel identity, full sweep, NEON forced
        env:
          BLUNDERDB_GAMMONNET_KERNEL: neon
        run: go test -count=1 -run 'TestKernel|TestDenseKernelsAgree|TestNEON' -v -timeout 600s ./pkg/blunderdb/engine/gammonnet/
        shell: bash

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20241118162539-34caac850176
        shell: bash

      - name: Batched kernel benchmark, go against neon
        run: |
          set -euo pipefail
          for k in go neon; do
            BLUNDERDB_GAMMONNET_KERNEL=$k go test -run '^$' -bench 'BenchmarkEvaluateBatchKernel' \
              -count=6 -benchtime=1s ./pkg/blunderdb/engine/gammonnet/ > "bench-$k.txt"
          done
          benchstat go=bench-go.txt neon=bench-neon.txt | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

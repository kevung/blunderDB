name: Publish to AUR

# Publishes/updates the blunderdb-bin AUR package after a GitHub release.
# OPT-IN: requires repo secrets AUR_SSH_PRIVATE_KEY, AUR_USERNAME, AUR_EMAIL,
# and an AUR account whose SSH key is registered. Without the secret the job
# runs but no-ops (see the "guard" step), so it never fails a release.
#
# TRIGGER: `workflow_run` on the completion of "Wails build", not `release:
# published`. The release is created by build.yml using the default
# GITHUB_TOKEN, and events raised by that token never cascade into another
# workflow — so a `release: published` trigger silently never fires.
# `workflow_run` is raised by GitHub itself when the run finishes, whatever
# token the run used, and it executes in the context of the default branch
# with full access to the repository secrets — so the AUR key is usable.
#
# It fires for every completed "Wails build" (pull requests, merges on main,
# tags): the job-level `if` drops everything but tag pushes, and the version
# step insists on an X.Y.Z tag (data-asset tags such as bearoff-data-1 must
# never reach the AUR). It does NOT require the run to have succeeded: the
# tarball is uploaded by the `build` job, and a failure elsewhere in the run
# (docs, a lint) is no reason to withhold a package whose asset exists — the
# download step fails loudly if it does not.
#
# Until 0.34.0 this workflow started on the tag push itself and polled the
# release for up to 30 minutes on a runner, waiting for the matrix to finish.
# Note: workflow_run only fires for a workflow file on the default branch.

on:
  workflow_run:
    workflows: ["Wails build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Released tag to publish (e.g. 0.27.1)
        required: true

jobs:
  aur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # head_branch carries the tag name for a tag push; `main` is a merge.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch != 'main'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On workflow_run the default checkout is the default branch; take
          # the tagged commit so packaging/aur/PKGBUILD.in matches the release.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Guard on AUR secret
        id: guard
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY not set — skipping AUR publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        id: v
        if: steps.guard.outputs.enabled == 'true'
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
          else
            version="$RUN_BRANCH"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "'$version' is not a version tag — skipping AUR publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Download the webkit2gtk-4.1 tarball and compute checksum
        id: dl
        if: steps.v.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          asset="blunderDB-linux-webkit2gtk-4.1-${VERSION}.tar.gz"
          # The build run is complete, so the asset is either there or never
          # will be; the short retry only absorbs the release API's eventual
          # consistency right after the upload.
          for i in $(seq 1 6); do
            if gh release download "$VERSION" -R "$GITHUB_REPOSITORY" -p "$asset" -D dl --clobber 2>/dev/null; then
              break
            fi
            echo "asset $asset not visible yet (attempt $i); waiting..."
            sleep 10
          done
          test -f "dl/$asset" || { echo "::error::$asset is not on release $VERSION — did the build job fail?"; exit 1; }
          echo "sha=$(sha256sum "dl/$asset" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Render PKGBUILD
        if: steps.v.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.dl.outputs.sha }}
        run: |
          set -euo pipefail
          sed -e "s/@PKGVER@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" \
            packaging/aur/PKGBUILD.in > PKGBUILD
          cat PKGBUILD

      - name: Publish to the AUR
        if: steps.v.outputs.enabled == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@9dfe151cf48f26a957bbd0379c120e79cb990e13 # v2.7.2
        with:
          pkgname: blunderdb-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.v.outputs.version }}"
          updpkgsums: false

<!doctype html><html><head><meta charset="utf-8"><style>html,body,#p{margin:0;width:100%;height:100%;background:#000}</style></head><body><div id="p"></div><script src="https://www.youtube.com/iframe_api"></script><script>
// Relays the IFrame Player with the parent through postMessage: the instant, play/pause, seek
// and the speed. The player has no full screen of its own (fs: 0): the transcription's theatre
// owns the window. A seek asked before the player is ready waits for it. A player that has not
// started yet is not touched: seekTo there tries to autoplay, the webview refuses it without a
// gesture, and the player is left on a black frame that a click no longer starts. The asked
// instant is kept and reported, and the first playing state starts from there.
var player, ready = false, want = null;
// The sound the viewer chose (mute, volume) is read from the player and put back after every
// speed change, which can reset it: a muted video must stay muted. `settle` holds the reading
// still while a speed change settles.
var sound = null, settle = 0;
function readSound() { return { muted: !!player.isMuted(), volume: player.getVolume() }; }
function restoreSound() {
    if (!ready || !sound) return;
    if (!!player.isMuted() !== sound.muted) { if (sound.muted) player.mute(); else player.unMute(); }
    if (typeof sound.volume === 'number' && player.getVolume() !== sound.volume) player.setVolume(sound.volume);
}
function watchSound() {
    if (Date.now() < settle) { restoreSound(); return; }
    var s = readSound();
    if (!sound || s.muted !== sound.muted || s.volume !== sound.volume) {
        sound = s;
        post({ type: 'volume', muted: s.muted, volume: s.volume });
    }
}
function setRate(r) {
    if (!sound) sound = readSound();
    settle = Date.now() + 1500;
    player.setPlaybackRate(r);
    restoreSound();
    setTimeout(restoreSound, 100);
    setTimeout(restoreSound, 500);
}
function onYouTubeIframeAPIReady() {
    player = new YT.Player('p', {
        width: '100%', height: '100%', videoId: '__VIDEO_ID__', playerVars: { playsinline: 1, rel: 0, fs: 0 },
        events: {
            onReady: function () {
                ready = true;
                if (want !== null) seek(want);
                post({ type: 'ready', duration: player.getDuration(), rates: player.getAvailablePlaybackRates() });
            },
            onPlaybackRateChange: function (e) { restoreSound(); post({ type: 'rate', rate: e.data }); },
            onStateChange: function (e) {
                if (e.data === 1 && want !== null) {
                    var w = want;
                    want = null;
                    if (Math.abs(player.getCurrentTime() - w) > 0.5) player.seekTo(w, true);
                }
                post({ type: 'state', state: e.data, time: now() });
            }
        }
    });
}
function now() { return want !== null ? want : player.getCurrentTime(); }
function seek(t) {
    if (!ready) { want = t; return; }
    var s = player.getPlayerState();
    // -1 unstarted, 5 cued: getCurrentTime stays at 0 there, and seekTo would start the playback.
    if (s === -1 || s === 5) want = t;
    else { want = null; player.seekTo(t, true); }
    post({ type: 'time', time: t });
}
// The parent's origin: the one it passes, else the referrer's. Only an http(s) origin is
// targeted and checked: a custom scheme (wails://) serialises differently from one webview to
// another, and a mismatch would drop every message. Replies still go only to the parent window.
var origin = '';
try { origin = new URLSearchParams(location.search).get('origin') || ''; } catch (e) {}
if (!/^https?:\/\//.test(origin)) { try { origin = new URL(document.referrer).origin; } catch (e) {} }
var checked = /^https?:\/\//.test(origin);
function post(m) { m.source = 'blunderdb-yt'; parent.postMessage(m, checked ? origin : '*'); }
setInterval(function () { if (ready) { post({ type: 'time', time: now() }); watchSound(); } }, 250);
addEventListener('message', function (e) {
    if (e.source !== parent || (checked && e.origin !== origin)) return;
    var m = e.data || {};
    if (m.type === 'seek') seek(m.time);
    if (!ready) return;
    if (m.type === 'play') player.playVideo();
    else if (m.type === 'pause') player.pauseVideo();
    else if (m.type === 'volume') { sound = { muted: !!m.muted, volume: m.volume }; restoreSound(); }
    else if (m.type === 'rate') { setRate(m.rate); post({ type: 'rate', rate: player.getPlaybackRate() }); }
});
</script></body></html>

# nfpm config — generates .deb and .rpm from a single spec.
# The webkit2gtk-4.1 binary must be placed at build/bin/blunderDB first
# (nfpm expands ${VERSION} in fields but NOT in the `src` glob, so the binary
# path is fixed rather than an env var). VERSION is read from the environment.
# Build:
#   cp build/bin/blunderDB-linux-webkit2gtk-4.1-<ver> build/bin/blunderDB
#   mkdir -p build/linux/completions
#   build/bin/blunderDB completion bash > build/linux/completions/blunderdb.bash
#   build/bin/blunderDB completion zsh  > build/linux/completions/_blunderdb
#   build/bin/blunderDB completion fish > build/linux/completions/blunderdb.fish
#   VERSION=0.27.1 nfpm package -f build/linux/nfpm.yaml -p deb
#   VERSION=0.27.1 nfpm package -f build/linux/nfpm.yaml -p rpm
#
# Only the webkit2gtk-4.1 variant is packaged (Ubuntu 22.04+/Debian 12+/
# Fedora 36+/openSUSE recent). Older distros keep the raw binary + tar.gz.
name: blunderdb
arch: amd64
platform: linux
version: ${VERSION}
version_schema: none
section: games
priority: optional
maintainer: Kévin Unger <kevin.unger@proton.me>
description: |
  Backgammon blunder analysis tool.
  Import, store, search and study backgammon positions from eXtreme Gammon,
  GnuBG, BGBlitz and Jellyfish. GUI and CLI in a single binary.
vendor: Kévin Unger
homepage: https://github.com/kevung/blunderDB
license: MIT

contents:
  - src: build/bin/blunderDB
    dst: /usr/bin/blunderDB
    file_info:
      mode: 0755
  # The CLI documentation (CLI_USAGE.md, doc/source/cli.rst) and the Homebrew
  # cask / winget manifests all call the command `blunderdb`; without this
  # link a .deb/.rpm user following it gets "command not found".
  - src: /usr/bin/blunderDB
    dst: /usr/bin/blunderdb
    type: symlink
  - src: build/linux/blunderdb.desktop
    dst: /usr/share/applications/blunderdb.desktop
  - src: build/linux/io.github.kevung.blunderDB.metainfo.xml
    dst: /usr/share/metainfo/io.github.kevung.blunderDB.metainfo.xml
  - src: build/linux/blunderdb-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/blunderdb.png
  - src: build/linux/blunderdb-256.png
    dst: /usr/share/pixmaps/blunderdb.png
  # Shell completion — `blunderdb completion <shell>` (B.8, #176), generated
  # from the staged binary just above rather than committed, so it can never
  # drift from the subcommand table it reads (handlers()).
  - src: build/linux/completions/blunderdb.bash
    dst: /usr/share/bash-completion/completions/blunderdb
  - src: build/linux/completions/_blunderdb
    dst: /usr/share/zsh/site-functions/_blunderdb
  - src: build/linux/completions/blunderdb.fish
    dst: /usr/share/fish/vendor_completions.d/blunderdb.fish
  # Licence and third-party notices: the binary embeds MIT-licensed code and
  # data (Strehl network, Wails, pgx…) whose licences require the notice to
  # travel with every copy. /usr/share/doc/<pkg>/ is where both dpkg and rpm
  # expect them. Plain entries on purpose: nfpm's `type: doc`/`license` are
  # rpm-only and the deb packager silently drops such files.
  - src: LICENSE
    dst: /usr/share/doc/blunderdb/LICENSE
  - src: THIRD_PARTY.md
    dst: /usr/share/doc/blunderdb/THIRD_PARTY.md

overrides:
  deb:
    depends:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
  rpm:
    depends:
      - webkit2gtk4.1
      - gtk3

# nginx equivalent of deploy/Caddyfile — a snippet, not a full deployable
# config: drop the `map` block into the http {} context and the `server {}`
# block into your site config, adjusting server_name/TLS to taste. Everything
# nginx needs here (ngx_http_auth_basic_module, ngx_http_map_module) is a
# core module compiled into every stock nginx package.
#
# Demo credentials: generate a real htpasswd file with
#   htpasswd -B -c /etc/nginx/.htpasswd alice
# CHANGE the demo password before using this anywhere but a laptop.

http {
    # Map the authenticated login (nginx sets $remote_user once auth_basic
    # succeeds) to the tenant's positive integer — the only spelling of
    # X-Tenant-ID the daemon accepts (ADR-0005, amendment 2026-09-03). This
    # is the identity-to-tenant mapping ADR-0005 says is the proxy's job:
    # the daemon never sees "alice", only "1".
    map $remote_user $tenant_id {
        default 0;
        alice   1;
        bob     2;
    }

    server {
        listen 80;
        server_name blunderdb.example.com;

        auth_basic           "blunderdb";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            # Guard, then inject: clear whatever the client sent BEFORE
            # setting the authenticated value. Redundant with nginx's own
            # "last proxy_set_header wins" rule for the same header name in
            # the same context, kept anyway so the intent survives someone
            # splitting this location across an include later, and it stays
            # correct on its own even if only one of the two lines carries
            # over during such a refactor.
            proxy_set_header X-Tenant-ID "";
            proxy_set_header X-Tenant-ID $tenant_id;

            proxy_pass http://blunderdb-serve:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}

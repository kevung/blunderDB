# golangci-lint v2 configuration for blunderDB
# https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  # Default linters in v2 already include: errcheck, govet, staticcheck,
  # unused, ineffassign, gosimple.  We add nolintlint to enforce hygiene and
  # rowserrcheck so a `for rows.Next()` loop is always followed by rows.Err() —
  # an iteration error otherwise truncates the result silently.
  #
  # funlen and gocognit (E.6, #222): non-regressive ceilings on function size
  # and cognitive complexity, the same shape as frontend/.svelte-warnings-budget
  # and frontend/.color-token-budget — a ratchet that only ever tightens, not
  # an unreachable strict zero. Each threshold equals the worst non-test
  # function measured today, and each is a DIFFERENT function: the ceiling is
  # three independent high-water marks, not one function's profile.
  #
  # Re-measured 2026-09-04, twice: after B.15 split `find` into
  # buildWhere/scanRows/applyGoFilters (573/316/462 → 438/180/200), then after
  # the same fiche split `Compute` into eleven passes (438 → 280 lines).
  # The line ceiling is now held by `migrate_1_9_0_to_2_0_0`, a migration frozen
  # by definition (its DDL is what a 1.9.0 database needs, forever) — the next
  # real target is `parseSearchFlags`, which sets the statement ceiling at 180
  # and is 280 lines behind it. `applyGoFilters` sets the cognitive one. Splitting a flagged function must lower the
  # number it set in the same commit, never leave it where a fatter function
  # could still slip in.
  #
  # Measure the real ceiling by RAISING each threshold until the linter goes
  # quiet, never by lowering it to 1: funlen reports at most one violation per
  # function (lines first, then statements), so at 1 almost every function
  # answers "too many statements" and the longest ones never say how long they
  # are. That mistake put this ratchet at 77 lines for a tree whose longest
  # function is 438. Test
  # functions are excluded below: a long table-driven test or a migration
  # round-trip fixture is not the dette this fiche targets, and forcing them
  # under the same ceiling would fight the fixture shape instead of real
  # complexity (see the `_test\.go$` rule under exclusions.rules).
  #
  # gosec (E.6, #222): re-evaluated from "deliberately not enabled" (below)
  # to "enabled, scoped". A repo-wide pass is still ~200 findings, almost all
  # false positives on this codebase's own domain (board indices/pip counts
  # that cannot overflow, math/rand for the Zobrist keys, parameterised SQL
  # gosec's heuristic still flags) — that refusal stays correct for the bulk
  # of the tree. But two directories ARE the surfaces gosec exists for: the
  # HTTP daemon that CLAUDE.md says performs no authentication of its own
  # (internal/server) and the crypto/signing package (issuance) — there,
  # gosec earns its keep. Scoped via exclusions.rules' path-except below
  # rather than a second linters.enable entry (gosec has none, one entry
  # covers both the enable and the scope).
  #
  # Evaluated and deliberately NOT enabled (2026-09):
  # - noctx: 874 findings — every database call would need a context first.
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - funlen
    - gocognit
    - gosec
    - nolintlint
    - rowserrcheck
    - sqlclosecheck

  settings:
    errcheck:
      exclude-functions:
        # defer tx.Rollback() is idiomatic Go — the error is irrelevant
        # after a successful Commit, and on failure the deferred call is
        # best-effort cleanup.
        - (*database/sql.Tx).Rollback

    funlen:
      lines: 296      # migrate_1_9_0_to_2_0_0, db_migration_v1.go — a frozen migration, left alone
      statements: 180 # parseSearchFlags, same function

    gocognit:
      min-complexity: 200 # (*SearchStore).applyGoFilters, sqlshared/search.go

    nolintlint:
      require-explanation: true
      require-specific: true

    rowserrcheck:
      # database/sql is covered by default; the PostgreSQL backend iterates
      # pgx.Rows, whose Err() carries the same contract.
      packages:
        - github.com/jackc/pgx/v5

    staticcheck:
      checks:
        - "all"
        - "-QF*"    # quick-fix suggestions are style, not bugs — revisit later

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - frontend/wailsjs
      - third_party$
      - builtin$
      - examples$
    rules:
      # ST1003 (initialisms) is enforced everywhere but the migration
      # functions (db_migration.go and its db_migration_v*.go companions),
      # which use underscores (migrate_X_to_Y) by convention.
      - linters: [staticcheck]
        path: "db_migration(_v[0-9_]+)?\\.go$"
        text: "ST1003"
      # stats_legacy_oracle_test.go is the pre-unification statistics SQL,
      # copied verbatim as the oracle the storage backends are checked
      # against; its loops swallow iteration errors the way the old code did,
      # and three of the findings are false positives (rows handed to
      # scanPositionIDs, which does check Err). It is not maintained code.
      - linters: [rowserrcheck]
        path: "stats_legacy_oracle_test\\.go$"
      # internal/cli and cmd/ print user-facing output straight to stdout/stderr
      # via fmt.Print*; checking those errors buys nothing (the process is about
      # to exit either way). Everywhere else, an unchecked fmt.Print* error is
      # still a real errcheck finding.
      - linters: [errcheck]
        path: "^(internal/cli/|cmd/)"
        text: "Error return value of `fmt\\.(Println|Printf|Fprintf|Fprintln)` is not checked"
      # funlen/gocognit target production complexity (E.6, #222) — see the
      # enable-list comment. A big table-driven test or migration
      # round-trip fixture is not the dette either linter exists to catch.
      - linters: [funlen, gocognit]
        path: "_test\\.go$"
      # gosec scoped to the two surfaces it was enabled for (E.6, #222): the
      # unauthenticated HTTP daemon and the crypto/signing package. Test
      # files in both are excluded the same way as funlen/gocognit above —
      # a test's own temp files and fixtures are not the untrusted input
      # gosec is meant to catch, and everywhere else in the tree the
      # findings are the same false positives the top-of-file note already
      # dismisses for a repo-wide enable.
      - linters: [gosec]
        path-except: "^(internal/server/|pkg/blunderdb/issuance/)"
      - linters: [gosec]
        path: "^(internal/server/|pkg/blunderdb/issuance/).*_test\\.go$"
      # G304 (file path from a variable) inside issuance is the package
      # doing exactly what it is for: dbPath/outPath/path are always a local
      # path the CLI or GUI caller supplied directly, never a request body —
      # the opposite of the internal/server occurrences, which get a
      # per-call //nolint because there the caller context varies line by
      # line. See container.go's and identity.go's own doc comments for the
      # threat model (protects transport, not the legitimate local user).
      - linters: [gosec]
        path: "pkg/blunderdb/issuance/(container|identity)\\.go$"
        text: "G304"

issues:
  max-issues-per-linter: 0   # no cap — show everything
  max-same-issues: 0         # no cap
  # Without this, golangci-lint prints at most ONE issue per (file, line) —
  # picking whichever linter's issue sorts first — so a real gocognit
  # finding on a function's signature line silently hides a funlen finding
  # on that SAME line (both attach to the `func` line), and vice versa.
  # Found while calibrating E.6's funlen/gocognit thresholds above: with the
  # default (true), CommitImportDatabase's funlen violation disappeared
  # entirely behind its gocognit one. A complexity gate that can silently
  # lose half its findings is worse than not having it.
  uniq-by-line: false

formatters:
  # Neither was enabled before 2026-09: this section only ever held
  # exclusions, so `golangci-lint run` never caught the 8 files gofmt itself
  # disagreed with (E.5, #221) — nothing but a manual `gofmt -l` did.
  enable:
    - gofmt
    - goimports

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
